<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Świąteczna przygoda Kaki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fbf3e4; --ink:#3b2a20; --red:#b8322a; --red-d:#8e211b; --green:#2f6b45; --gold:#e9b949;
  --panel:#fffaf0; --shadow:0 10px 30px rgba(40,20,10,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1c1410;color:var(--ink);font-family:Fredoka,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
img{user-select:none;-webkit-user-drag:none}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,179.1vh);aspect-ratio:1920/1072;background:#2a1d16 url(art/room.webp) center/cover;overflow:hidden;border-radius:6px;container-type:inline-size}
/* window sky darkens as Wigilia approaches */
#dusk{position:absolute;left:42.5%;top:18.5%;width:20.8%;height:34%;background:#0a1030;mix-blend-mode:multiply;opacity:0;transition:opacity 1.5s;pointer-events:none}
#star{position:absolute;left:52%;top:22%;width:7%;aspect-ratio:1;border:0;background:none;padding:0;cursor:pointer;z-index:3}
#star svg{width:100%;height:100%;filter:drop-shadow(0 0 1.2cqw #fff6b0);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
/* room objects */
.obj{position:absolute;border:0;background:none;padding:0;cursor:pointer;transition:filter .2s,transform .2s}
.obj img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .8s}
.obj:hover,.obj:focus-visible{filter:drop-shadow(0 0 .6cqw #fff3a0) drop-shadow(0 0 .3cqw #ffd34e);outline:none}
.obj .tag{position:absolute;left:50%;top:-1.2cqw;transform:translate(-50%,-100%);background:rgba(255,250,240,.95);color:var(--ink);font-weight:700;font-size:1.25cqw;padding:.25em .7em;border-radius:99px;white-space:nowrap;opacity:0;transition:opacity .2s;box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none}
.obj:hover .tag,.obj:focus-visible .tag{opacity:1}
.obj .todo{position:absolute;right:8%;top:6%;width:2.2cqw;height:2.2cqw;border-radius:50%;background:var(--red);color:#fff;font-size:1.3cqw;display:grid;place-items:center;font-weight:700;box-shadow:0 0 0 .25cqw #fff;animation:bob 1.6s ease-in-out infinite}
.obj.done .todo{display:none}
@keyframes bob{50%{transform:translateY(-.4cqw)}}
#oTree{left:1.5%;bottom:14%;width:20%;height:53%}
#oFire{left:16.5%;top:42%;width:21.5%;height:34%}
#oFire .tag{top:1cqw}
#lightsMantel{position:absolute;left:16%;top:40.5%;width:23%;pointer-events:none;z-index:2}
#lightsWindow{position:absolute;left:36.5%;top:10.5%;width:33%;pointer-events:none;z-index:2}
.twinkle{animation:tw 1.4s ease-in-out infinite alternate}
@keyframes tw{to{filter:brightness(1.35) drop-shadow(0 0 .5cqw #ffe9a0)}}
#oSofa{left:36%;top:44%;width:30%;height:37%;cursor:default}
#oSofa:hover{filter:none}
#zzz{position:absolute;left:30%;top:-2%;font-size:2.4cqw;font-weight:700;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);animation:zz 2.4s ease-in-out infinite;pointer-events:none}
@keyframes zz{0%{opacity:0;transform:translateY(.5cqw)}50%{opacity:1}100%{opacity:0;transform:translateY(-1.5cqw)}}
#oSideboard{left:66%;top:38%;width:17%;height:41%}
#cookies{position:absolute;left:66.5%;top:47.5%;width:6.5%;pointer-events:none;z-index:2}
#oKitchen{left:84.5%;top:9%;width:15.5%;height:70%}
#oKitchen .tag{top:3cqw}
#oTable{left:51%;bottom:-2%;width:32%;height:33%}
#oTree .tag{top:auto;bottom:-1cqw;transform:translate(-50%,100%)}
#kaka{position:absolute;right:.5%;bottom:-2%;height:74%;pointer-events:none;filter:drop-shadow(0 .6cqw .8cqw rgba(0,0,0,.35));z-index:4}
/* checklist */
#list{position:absolute;left:1.2%;top:2.5%;width:21%;background:#fffdf6;border-radius:.8cqw;padding:.9cqw 1.1cqw;box-shadow:var(--shadow);font-size:1.25cqw;transform:rotate(-1.5deg);z-index:5}
#list h2{margin:0 0 .3em;font-size:1.2em;color:var(--red)}
#list button{display:flex;align-items:center;gap:.5em;width:100%;text-align:left;border:0;background:none;padding:.2em .1em;color:var(--ink);font-size:1em;border-radius:6px}
#list button:hover{background:#f6ead3}
#list .box{width:1.1em;height:1.1em;border:2px solid var(--ink);border-radius:4px;flex:none;display:grid;place-items:center;font-size:.8em;color:var(--green)}
#list .ok{text-decoration:line-through;opacity:.6}
#starhint{position:absolute;left:52%;top:3%;transform:translateX(-50%);background:var(--gold);color:var(--ink);padding:.4em 1em;border-radius:20px;font-weight:700;font-size:1.5cqw;box-shadow:var(--shadow);animation:bobx 1.6s ease-in-out infinite;z-index:5}
@keyframes bobx{50%{transform:translate(-50%,-6px)}}
#mute{position:absolute;right:1%;top:2%;z-index:10;border:0;background:rgba(255,250,240,.9);border-radius:50%;width:2.6em;height:2.6em;font-size:1.3cqw}
/* dialogue */
#dlg{position:absolute;left:3%;right:3%;bottom:3%;display:flex;gap:2%;align-items:center;background:rgba(255,250,240,.97);border-radius:1.2cqw;padding:1.2% 2%;box-shadow:var(--shadow);font-size:1.7cqw;cursor:pointer;z-index:20}
#dlg .face{width:8.5%;aspect-ratio:1;border-radius:50%;background:#f1dfc0 no-repeat;flex:none;border:.25cqw solid var(--red)}
#dlg .who{font-weight:700;color:var(--red);margin-bottom:.15em}
#dlg .next{margin-left:auto;font-size:.8em;opacity:.6;white-space:nowrap}
/* overlays */
.ov{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(20,12,8,.65);padding:12px}
.card{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);width:min(960px,100%);max-height:100%;overflow:auto;padding:18px 20px;position:relative}
.card h2{margin:0 0 4px;color:var(--red);font-size:clamp(20px,3vw,30px);padding-right:40px}
.card .sub{margin:0 0 12px;opacity:.8}
.x{position:absolute;right:12px;top:10px;border:0;background:#efe2c9;border-radius:50%;width:36px;height:36px;font-size:18px}
.btn{background:var(--red);color:#fff;border:0;border-radius:999px;padding:.6em 1.4em;font-weight:600;font-size:clamp(15px,2vw,20px);box-shadow:0 4px 0 var(--red-d)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--red-d)}
.btn.alt{background:var(--green);box-shadow:0 4px 0 #1d4a2e}
.msg{min-height:1.5em;font-weight:600;color:var(--green);margin-top:8px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* title */
#title{background:linear-gradient(rgba(10,14,30,.55),rgba(10,14,30,.8)),url(art/room.webp) center/cover;flex-direction:column;color:#fff;text-align:center;gap:12px}
#title h1{font-size:clamp(30px,6vw,64px);margin:0;color:#ffe9a8;text-shadow:0 4px 0 #8e211b}
#title p{margin:0;max-width:580px;opacity:.95;font-size:clamp(14px,2vw,20px);text-shadow:0 1px 4px #000}
#title .duo{display:flex;align-items:flex-end;gap:2vw;height:min(40vh,340px)}
#title .duo img{height:100%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
#title .duo img.k2{height:62%}
/* minigames */
canvas{display:block;width:100%;border-radius:12px;background:linear-gradient(#fff6e5,#f0d9b0);touch-action:none}
.bar{height:16px;background:#ecdcbf;border-radius:10px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),#56a46f);transition:width .2s}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (min-width:700px){.grid{grid-template-columns:repeat(6,1fr)}}
.mc{aspect-ratio:4/5;border:0;border-radius:12px;color:var(--ink);font-size:clamp(11px,1.5vw,15px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;transition:transform .25s;
  background:var(--red) radial-gradient(circle at 50% 50%,#d4483d 0 30%,transparent 31%) center/34px 34px;box-shadow:0 4px 0 var(--red-d),inset 0 0 0 4px #e9b949}
.mc .back{font-size:2em;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.mc img{width:88%;height:68%;object-fit:contain}
.mc.up{background:#fff;box-shadow:0 4px 0 #d9c7a5,inset 0 0 0 3px #f0e2c4}
.mc.got{background:#fdf0c9;box-shadow:inset 0 0 0 3px var(--gold);opacity:.85}
.choices{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.chip{border:0;background:#fff;border-radius:14px;padding:.6em 1em;font-size:clamp(15px,2vw,20px);box-shadow:0 3px 0 #d9c7a5}
.stack{display:flex;gap:8px;flex-wrap:wrap;min-height:46px;justify-content:center;align-items:center;background:#f5e7cc;border-radius:12px;padding:8px}
.stack span{background:#fff;border-radius:10px;padding:.3em .7em}
.tablepic{display:block;width:min(520px,90%);margin:0 auto}
#treeSvg{width:min(340px,75%);display:block;margin:0 auto}
.bb{cursor:pointer;transition:filter .15s}
.bb.on{filter:brightness(1.9) drop-shadow(0 0 10px #fff6a0)}
.kzWrap{position:relative;width:min(520px,90%);margin:0 auto;cursor:pointer;user-select:none}
.kzWrap img{width:100%;display:block;transition:filter .3s}
.kzWrap.sleep img{filter:brightness(.75) saturate(.8)}
.kzWrap .bub{position:absolute;left:18%;top:-4%;background:#fff;border-radius:16px;padding:.2em .6em;font-weight:700;font-size:clamp(18px,3vw,30px);box-shadow:0 3px 10px rgba(0,0,0,.25)}
#end{flex-direction:column;background:#0d1426;color:#fff;text-align:center;gap:12px}
#end h1{color:#ffe9a8;font-size:clamp(30px,6vw,60px);margin:0}
#endArt{width:min(900px,94vw);max-height:58vh;object-fit:cover;border-radius:14px;box-shadow:0 0 60px rgba(255,220,120,.3)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="stage" aria-label="Salon Kaki">
    <div id="dusk"></div>
    <button id="star" class="hidden" aria-label="Pierwsza gwiazdka"><svg viewBox="0 0 100 100"><path d="M50 4 L61 37 L96 37 L68 58 L78 92 L50 71 L22 92 L32 58 L4 37 L39 37Z" fill="#fff4b0"/></svg></button>
    <img id="lightsWindow" class="hidden twinkle" src="art/lights.webp" alt="">

    <button class="obj" id="oTree" data-task="tree" aria-label="Choinka"><img id="treeBare" src="art/tree_bare.webp" alt=""><img id="treeDeco" src="art/tree_deco.webp" alt="" style="opacity:0"><span class="tag">🎄 Choinka</span><span class="todo">!</span></button>
    <button class="obj" id="oFire" data-task="lights" aria-label="Kominek: lampki"><span class="tag">💡 Lampki z Kaczorem</span><span class="todo">!</span></button>
    <img id="lightsMantel" class="hidden twinkle" src="art/lights.webp" alt="">
    <button class="obj" id="oSofa" tabindex="-1" aria-hidden="true"><img src="art/kaczor.webp" alt=""><span id="zzz">Zzz</span></button>
    <button class="obj" id="oSideboard" data-task="dishes" aria-label="Kredens: przepisy"><span class="tag">📖 Dwanaście potraw</span><span class="todo">!</span></button>
    <img id="cookies" class="hidden" src="art/cookies.webp" alt="Pierniczki">
    <button class="obj" id="oKitchen" data-task="bake" aria-label="Kuchnia: pierniczki"><span class="tag">🍪 Kuchnia</span><span class="todo">!</span></button>
    <button class="obj" id="oTable" data-task="table" aria-label="Stół wigilijny"><img id="tableEmpty" src="art/table_empty.webp" alt=""><img id="tableSet" src="art/table_set.webp" alt="" style="opacity:0"><span class="tag">🍽️ Stół</span><span class="todo">!</span></button>
    <img id="kaka" src="art/kaka.webp" alt="Kaka">

    <div id="list" aria-label="Lista Kaki"><h2>📋 Lista Kaki</h2><div id="tasks"></div></div>
    <div id="starhint" class="hidden">⭐ Spójrz w okno!</div>
    <button id="mute" title="Dźwięk">🔊</button>
    <div id="dlg" class="hidden"><div class="face"></div><div><div class="who"></div><div class="txt"></div></div><div class="next">dalej ▸</div></div>
  </div>
</div>

<div id="title" class="ov">
  <div class="duo"><img src="art/kaka.webp" alt=""><img class="k2" src="art/kaczor.webp" alt=""></div>
  <h1>Świąteczna przygoda Kaki</h1>
  <p>Józefosław, koniec listopada. Kaka ma miesiąc, listę zadań i męża, który zaprzyjaźnił się z kanapą. Święta będą idealne — choćby nie wiem co.</p>
  <button class="btn" id="startBtn">Zaczynamy! 🎄</button>
  <button class="btn alt hidden" id="resetBtn">Od nowa</button>
</div>

<div id="game" class="ov hidden"><div class="card" id="gameCard"></div></div>

<div id="end" class="ov hidden">
  <h1>Wesołych Świąt!</h1>
  <img id="endArt" src="art/wigilia.webp" alt="Wigilia u Kaki">
  <p id="endTxt" style="max-width:640px;font-size:clamp(15px,2vw,20px)"></p>
  <button class="btn" id="againBtn">Zagraj jeszcze raz</button>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const TASKS=[
  {id:'bake',  name:'Upiec pierniczki'},
  {id:'tree',  name:'Ubrać choinkę'},
  {id:'dishes',name:'Dwanaście potraw'},
  {id:'table', name:'Nakryć do stołu'},
  {id:'lights',name:'Lampki (z Kaczorem)'},
];
const LINES={
  intro:['kaka','Kaczor! Jest dwudziesty drugi listopada. Mamy miesiąc, jedną listę i zero pierniczków. Święta będą idealne. Choćby nie wiem co.'],
  kaczor_intro:['kaczor','Mhm. Idealne. Obudź mnie na karpia.'],
  hub:['kaka','Wybierz zadanie, jakiekolwiek! No dobra… wszystkie pięć.'],
  bake:['kaka','Pierniczki! Łap miód, mąkę i przyprawy. Nie skarpetki. Skąd tu się wzięły skarpetki?'],
  tree:['kaka','Choinka jest taka goła. Powieś bombki tam, gdzie błyszczą!'],
  dishes:['kaka','Dwanaście potraw na Wigilię. Znajdź pary, zanim zadzwoni Babcia, żeby nas sprawdzić!'],
  table:['kaka','Sianko pod obrus, opłatek na wierzch i jeden talerz więcej dla niespodziewanego gościa. Nawet jeśli to tylko kot sąsiadów.'],
  lights:['kaka','Kaczor rozplątuje lampki. Pod nadzorem. Za każdym razem, jak przyśnie, obudź go!'],
  kaczor_awake:['kaczor','Nie śpię. Naprawdę nie śpię. Tylko oczy mi odpoczywają.'],
  done:['kaka','Gotowe! Pięknie! Kaczor, patrz! … Nie patrzy.'],
  retry:['kaka','Spokojnie! Święta wszystko wybaczą. Spróbuj jeszcze raz.'],
  star:['kaka','Kaczor… patrz. Pierwsza gwiazdka. Wesołych Świąt, kochanie.'],
  kaczor_star:['kaczor','Wesołych Świąt. … To co… już karp?'],
};
// portrait crops: [image, background-size, background-position]
const FACES={kaka:['art/kaka.webp','250%','50% 1%'],kaczor:['art/kaczor.webp','330%','21% 0%']};
const NAMES={kaka:'Kaka',kaczor:'Kaczor'};

let done={}; try{done=JSON.parse(localStorage.getItem('kaka-done')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('kaka-done',JSON.stringify(done))}catch(e){}};
let muted=false, cur=null;
// background music: loops quietly, dips while someone is talking
const bgm=new Audio('audio/music.mp3'); bgm.loop=true; bgm.preload='auto';
const BGM_VOL=.32, BGM_DUCK=.1; let bgmTarget=BGM_VOL; bgm.volume=BGM_VOL;
setInterval(()=>{ const v=bgm.volume, d=bgmTarget-v; if(Math.abs(d)>.005) bgm.volume=Math.max(0,Math.min(1,v+Math.sign(d)*.02)); },40);
function startMusic(){ if(!muted) bgm.play().catch(()=>{}); }
function duck(on){ bgmTarget=on?BGM_DUCK:BGM_VOL; }
function play(key){ if(cur){cur.pause();cur=null} if(muted) return; const a=new Audio('audio/'+key+'.mp3'); cur=a;
  duck(true); const up=()=>{ if(cur===a||!cur) duck(false); }; a.onended=up; a.onpause=up; a.onerror=up;
  a.play().catch(up); return a; }
$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'🔇':'🔊'; if(muted){ if(cur)cur.pause(); bgm.pause(); } else startMusic(); };

// dialogue queue
let dq=[], dcb=null;
function say(keys,cb){ dq=keys.slice(); dcb=cb; nextLine(); }
function nextLine(){
  const d=$('#dlg');
  if(!dq.length){ d.classList.add('hidden'); if(cur)cur.pause(); const c=dcb; dcb=null; c&&c(); return; }
  const k=dq.shift(), [who,txt]=LINES[k], f=FACES[who], face=d.querySelector('.face');
  face.style.backgroundImage=`url("${f[0]}")`; face.style.backgroundSize=f[1]; face.style.backgroundPosition=f[2];
  d.querySelector('.who').textContent=NAMES[who];
  d.querySelector('.txt').textContent=txt;
  d.classList.remove('hidden');
  play(k);
}
$('#dlg').onclick=nextLine;

// hub state
function render(){
  const t=$('#tasks'); t.innerHTML='';
  TASKS.forEach(task=>{
    const b=document.createElement('button');
    b.innerHTML=`<span class="box">${done[task.id]?'✔':''}</span><span class="${done[task.id]?'ok':''}">${task.name}</span>`;
    b.onclick=()=>open(task.id);
    t.appendChild(b);
  });
  const show=(sel,on)=>$(sel).classList.toggle('hidden',!on);
  show('#cookies',done.bake); show('#lightsMantel',done.lights); show('#lightsWindow',done.lights);
  $('#treeDeco').style.opacity=done.tree?1:0; $('#treeBare').style.opacity=done.tree?0:1;
  $('#tableSet').style.opacity=done.table?1:0; $('#tableEmpty').style.opacity=done.table?0:1;
  document.querySelectorAll('.obj[data-task]').forEach(o=>o.classList.toggle('done',!!done[o.dataset.task]));
  const all=TASKS.every(x=>done[x.id]);
  show('#star',all); show('#starhint',all);
  $('#dusk').style.opacity=TASKS.filter(x=>done[x.id]).length/5*.7;
  $('#zzz').style.display=done.lights?'none':'';
}
document.querySelectorAll('.obj[data-task]').forEach(o=>o.addEventListener('click',()=>open(o.dataset.task)));
$('#star').addEventListener('click',ending);

// ---------- minigame shell ----------
let stopGame=null;
function open(id){
  if(!$('#dlg').classList.contains('hidden')) return;
  const g=GAMES[id]; $('#game').classList.remove('hidden');
  const card=$('#gameCard'); card.innerHTML='';
  const x=document.createElement('button'); x.className='x'; x.textContent='✕'; x.title='Zamknij'; x.onclick=closeGame; card.appendChild(x);
  play(id);
  stopGame=g(card,()=>finish(id))||null;
}
function closeGame(){ if(stopGame)stopGame(); stopGame=null; $('#game').classList.add('hidden'); if(cur)cur.pause(); }
function finish(id){
  setTimeout(()=>{
    closeGame(); done[id]=true; save(); render();
    say(['done']);
  },1100);
}
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstElementChild;}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const loadImg=src=>{const i=new Image();i.src=src;return i;};

const GAMES={
// 1. catch ingredients
bake(card,win){
  card.append(el('<h2>🍪 Pierniczki</h2>'),el('<p class="sub">Przesuwaj miskę (palcem, myszką albo strzałkami). Złap 15 składników — omijaj skarpetki Kaczora!</p>'));
  const bar=el('<div class="bar"><i></i></div>'), cv=document.createElement('canvas'), msg=el('<div class="msg">&nbsp;</div>');
  card.append(bar,cv,msg);
  const W=800,H=460; cv.width=W; cv.height=H; const c=cv.getContext('2d');
  const GOOD=['miod','maka','jajko','maslo','orzechy'].map(n=>loadImg('art/ing/'+n+'.webp')), BAD=loadImg('art/ing/skarpetka.webp');
  let bx=W/2, items=[], score=0, raf, last=performance.now(), keys={}, over=false;
  const mv=e=>{const r=cv.getBoundingClientRect(); bx=(e.clientX-r.left)/r.width*W;};
  cv.addEventListener('pointermove',mv); cv.addEventListener('pointerdown',mv);
  const kd=e=>{keys[e.key]=e.type==='keydown'}; addEventListener('keydown',kd); addEventListener('keyup',kd);
  const S=64;
  function draw(img,x,y,rot){ if(!img.complete||!img.naturalWidth) return; const r=img.naturalWidth/img.naturalHeight, w=r>1?S:S*r, h=r>1?S/r:S;
    c.save(); c.translate(x,y); c.rotate(rot); c.drawImage(img,-w/2,-h/2,w,h); c.restore(); }
  function loop(now){
    const dt=Math.min(.05,(now-last)/1000); last=now;
    if(keys.ArrowLeft) bx-=600*dt; if(keys.ArrowRight) bx+=600*dt; bx=Math.max(70,Math.min(W-70,bx));
    if(!over && Math.random()<dt*1.6){ const bad=Math.random()<.22; items.push({x:50+Math.random()*(W-100),y:-40,v:150+Math.random()*90+score*6,img:bad?BAD:GOOD[Math.random()*GOOD.length|0],bad,rot:0,vr:(Math.random()-.5)*2}); }
    c.clearRect(0,0,W,H);
    items.forEach(it=>{ it.y+=it.v*dt; it.rot+=it.vr*dt; draw(it.img,it.x,it.y,it.rot);
      if(!it.hit && it.y>H-80 && it.y<H-20 && Math.abs(it.x-bx)<75){ it.hit=true;
        if(it.bad){ score=Math.max(0,score-1); msg.textContent='Skarpetka Kaczora! 🧦 −1'; msg.style.color='var(--red)'; }
        else { score++; msg.textContent=['Mniam!','Pięknie!','Jeszcze!','Tak trzymać!'][score%4]; msg.style.color='var(--green)'; }
      }});
    items=items.filter(it=>!it.hit&&it.y<H+50);
    // mixing bowl
    const g=c.createLinearGradient(0,H-70,0,H-10); g.addColorStop(0,'#d24a3f'); g.addColorStop(1,'#8e211b');
    c.fillStyle=g; c.beginPath(); c.moveTo(bx-80,H-62); c.quadraticCurveTo(bx-70,H-8,bx,H-8); c.quadraticCurveTo(bx+70,H-8,bx+80,H-62); c.closePath(); c.fill();
    c.fillStyle='#f6e7c8'; c.beginPath(); c.ellipse(bx,H-62,80,12,0,0,Math.PI*2); c.fill();
    c.strokeStyle='#e9b949'; c.lineWidth=4; c.beginPath(); c.moveTo(bx-62,H-40); c.quadraticCurveTo(bx,H-30,bx+62,H-40); c.stroke();
    bar.firstChild.style.width=Math.min(100,score/15*100)+'%';
    if(score>=15 && !over){ over=true; msg.textContent='Ciasto gotowe! 🍪'; win(); }
    raf=requestAnimationFrame(loop);
  }
  raf=requestAnimationFrame(loop);
  return ()=>{cancelAnimationFrame(raf); removeEventListener('keydown',kd); removeEventListener('keyup',kd);};
},
// 2. bauble sequence memory on the real tree
tree(card,win){
  card.append(el('<h2>🎄 Choinka</h2>'),el('<p class="sub">Patrz, które bombki zabłysną, i dotknij ich w tej samej kolejności. Trzy rundy.</p>'));
  const COL=['#c0392b','#2f6fd1','#e9b949','#d2569b','#2fa37a','#8a5ad2'];
  const POS=[[150,190],[108,265],[195,280],[85,370],[152,355],[220,385]];
  const svg=el(`<svg id="treeSvg" viewBox="0 0 300 490"><image href="art/tree_bare.webp" x="0" y="0" width="300" height="490" preserveAspectRatio="xMidYMid meet"/>
    ${POS.map((p,i)=>`<g class="bb" data-i="${i}"><circle cx="${p[0]}" cy="${p[1]}" r="21" fill="${COL[i]}" stroke="#fff6d8" stroke-width="3"/><circle cx="${p[0]-7}" cy="${p[1]-7}" r="5" fill="#fff" opacity=".7"/><rect x="${p[0]-4}" y="${p[1]-27}" width="8" height="7" fill="#e9b949"/></g>`).join('')}</svg>`);
  const msg=el('<div class="msg">Patrz uważnie…</div>');
  card.append(svg,msg);
  const balls=[...svg.querySelectorAll('.bb')];
  let round=0, seq=[], inp=0, busy=true, timers=[], dead=false;
  const LEN=[3,4,5];
  const flash=i=>{balls[i].classList.add('on'); timers.push(setTimeout(()=>balls[i].classList.remove('on'),420));};
  function show(){ busy=true; inp=0; msg.textContent=`Runda ${round+1}/3 — patrz uważnie…`; msg.style.color='var(--green)';
    seq.forEach((b,k)=>timers.push(setTimeout(()=>flash(b),700+k*650)));
    timers.push(setTimeout(()=>{busy=false;msg.textContent='Teraz Ty!';},700+seq.length*650));
  }
  function newRound(){ seq=Array.from({length:LEN[round]},()=>Math.random()*6|0); show(); }
  balls.forEach(b=>b.addEventListener('click',()=>{
    if(busy||dead) return; const i=+b.dataset.i; flash(i);
    if(i===seq[inp]){ inp++; if(inp===seq.length){ round++; if(round===3){ busy=true; msg.textContent='Choinka błyszczy! ✨'; svg.querySelector('image').setAttribute('href','art/tree_deco.webp'); win(); } else { msg.textContent='Brawo! Następna runda…'; busy=true; timers.push(setTimeout(newRound,900)); } } }
    else { msg.textContent='Ups, prawie! Pokażę jeszcze raz.'; msg.style.color='var(--red)'; svg.classList.add('shake'); setTimeout(()=>svg.classList.remove('shake'),400); busy=true; timers.push(setTimeout(show,1100)); }
  }));
  timers.push(setTimeout(newRound,2500));
  return ()=>{dead=true; timers.forEach(clearTimeout);};
},
// 3. memory pairs of the twelve dishes
dishes(card,win){
  const ALL=[['Barszcz','barszcz'],['Uszka','uszka'],['Pierogi','pierogi'],['Karp','karp'],['Śledź','sledz'],['Ryba po grecku','ryba'],['Kapusta z grochem','kapusta'],['Zupa grzybowa','grzybowa'],['Kutia','kutia'],['Makowiec','makowiec'],['Piernik','piernik'],['Kompot z suszu','kompot']];
  card.append(el('<h2>📖 Dwanaście potraw</h2>'),el('<p class="sub">Odkrywaj karty i znajdź pary. Dwie tury po sześć potraw.</p>'));
  const msg=el('<div class="msg">&nbsp;</div>'), grid=el('<div class="grid"></div>'); card.append(grid,msg);
  let part=0, open=[], lock=false, got=0, timers=[];
  const BACK='<span class="back">⭐</span>';
  function deal(){
    const set=ALL.slice(part*6,part*6+6); got=0; grid.innerHTML='';
    shuffle([...set,...set]).forEach(([n,f])=>{
      const b=el(`<button class="mc" aria-label="karta">${BACK}</button>`); b.dataset.n=n;
      b.onclick=()=>{ if(lock||b.classList.contains('up')||b.classList.contains('got')) return;
        b.classList.add('up'); b.innerHTML=`<img src="art/dish/${f}.webp" alt=""><span>${n}</span>`; open.push(b);
        if(open.length===2){ lock=true; const [a,c]=open;
          if(a.dataset.n===c.dataset.n){ a.classList.add('got'); c.classList.add('got'); open=[]; lock=false; got++; msg.textContent=`${n} ✔ (${part*6+got}/12)`;
            if(got===6){ if(part===0){ part=1; msg.textContent='Połowa! Teraz desery i reszta…'; timers.push(setTimeout(deal,1200)); } else { msg.textContent='Wszystkie dwanaście! 🍽️'; win(); } } }
          else timers.push(setTimeout(()=>{[a,c].forEach(x=>{x.classList.remove('up');x.innerHTML=BACK}); open=[]; lock=false;},900));
        }
      };
      grid.appendChild(b);
    });
  }
  deal();
  return ()=>timers.forEach(clearTimeout);
},
// 4. set the table: order + extra plate
table(card,win){
  card.append(el('<h2>🍽️ Nakrywamy do stołu</h2>'));
  const pic=el('<img class="tablepic" src="art/table_empty.webp" alt="Stół">');
  const sub=el('<p class="sub">Co kładziemy najpierw? Wybieraj po kolei — od samego dołu.</p>'), stack=el('<div class="stack"></div>'), ch=el('<div class="choices"></div>'), msg=el('<div class="msg">&nbsp;</div>');
  card.append(pic,sub,stack,ch,msg);
  const ORDER=[['Sianko','🌾'],['Obrus','🤍'],['Opłatek','✨'],['Talerze','🍽️'],['Świeca','🕯️']];
  const HINT={Sianko:'Sianko idzie pod obrus!',Obrus:'Obrus przykrywa sianko.',Opłatek:'Opłatek kładziemy na obrusie.',Talerze:'Talerze — zaraz po opłatku.',Świeca:'Świeca na koniec, dla nastroju.'};
  let step=0;
  shuffle(ORDER.slice()).forEach(([n,e])=>{
    const b=el(`<button class="chip">${e} ${n}</button>`);
    b.onclick=()=>{ if(n===ORDER[step][0]){ step++; b.remove(); stack.append(el(`<span>${e} ${n}</span>`)); msg.style.color='var(--green)'; msg.textContent='Tak!';
        if(step===ORDER.length) plates(); }
      else { b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),400); msg.style.color='var(--red)'; msg.textContent='Hmm, nie teraz. '+HINT[ORDER[step][0]]; } };
    ch.append(b);
  });
  function plates(){
    sub.textContent='Goście: Kaka, Kaczor, Babcia, Dziadek i ciocia Ela. Ile talerzy postawić?';
    ch.innerHTML=''; msg.innerHTML='&nbsp;';
    [4,5,6,7].forEach(n=>{ const b=el(`<button class="chip">🍽️ ${n}</button>`);
      b.onclick=()=>{ if(n===6){ msg.style.color='var(--green)'; msg.textContent='Tak! Jeden talerz więcej dla wędrowca. 🐈'; ch.innerHTML=''; pic.src='art/table_set.webp'; win(); }
        else { b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),400); msg.style.color='var(--red)'; msg.textContent=n<6?'Za mało… a niespodziewany gość?':'Aż tyle? Babcia nie przywiezie aż tylu gości.'; } };
      ch.append(b); });
  }
},
// 5. keep Kaczor awake while he untangles the lights
lights(card,win){
  card.append(el('<h2>💡 Lampki z Kaczorem</h2>'),el('<p class="sub">Kaczor rozplątuje lampki. Gdy przyśnie — dotknij go, żeby się obudził.</p>'));
  const bar=el('<div class="bar"><i></i></div>');
  const kz=el('<div class="kzWrap" role="button" tabindex="0"><img src="art/kaczor.webp" alt="Kaczor"><span class="bub">🧶 …</span></div>');
  const msg=el('<div class="msg">&nbsp;</div>');
  card.append(bar,kz,msg);
  const bub=kz.querySelector('.bub');
  let p=0, asleep=false, nap=2.5+Math.random()*2, raf, last=performance.now(), wokeOnce=false, finished=false;
  const draw=()=>{kz.classList.toggle('sleep',asleep); bub.textContent=asleep?'😴 Zzz…':(finished?'💡 Gotowe!':'🧶 rozplątuję…');};
  function poke(){ if(finished) return;
    if(asleep){ asleep=false; nap=2+Math.random()*2.5; msg.style.color='var(--green)'; msg.textContent=['Pobudka!','Kaczor, lampki!','Hej, nie śpimy!'][Math.random()*3|0];
      if(!wokeOnce){ wokeOnce=true; play('kaczor_awake'); } draw(); }
    else { msg.style.color='var(--ink)'; msg.textContent='Nie przeszkadzaj, on akurat pracuje.'; }
  }
  kz.onclick=poke; kz.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')poke()};
  function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now;
    if(!finished){ if(!asleep){ p+=dt/16; nap-=dt; if(nap<=0){asleep=true; draw();} }
      bar.firstChild.style.width=Math.min(100,p*100)+'%';
      if(p>=1){ finished=true; asleep=false; draw(); msg.textContent='Lampki rozplątane! 💡'; win(); } }
    raf=requestAnimationFrame(loop);
  }
  draw(); raf=requestAnimationFrame(loop);
  return ()=>cancelAnimationFrame(raf);
},
};

// ---------- ending ----------
function ending(){
  say(['star','kaczor_star'],()=>{
    $('#end').classList.remove('hidden');
    $('#endTxt').textContent='Pierwsza gwiazdka zabłysła. Pierniczki upieczone, choinka ubrana, dwanaście potraw na stole, sianko pod obrusem, talerz dla wędrowca i lampki rozplątane. Kaczor nawet nie zasnął przy barszczu. Prawie.';
  });
}
$('#againBtn').onclick=()=>{done={};save();render();$('#end').classList.add('hidden');say(['hub']);};

// ---------- title ----------
const started=Object.keys(done).length>0;
if(started){ $('#startBtn').textContent='Graj dalej 🎄'; $('#resetBtn').classList.remove('hidden'); }
$('#resetBtn').onclick=()=>{done={};save();render();go(true)};
$('#startBtn').onclick=()=>go(!started);
function go(fresh){ $('#title').classList.add('hidden'); startMusic(); render(); say(fresh?['intro','kaczor_intro','hub']:['hub']); }
render();
})();
</script>
