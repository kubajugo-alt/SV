<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Świąteczna przygoda Kaki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Lobster&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fbf3e4; --ink:#3b2a20; --red:#b8322a; --red-d:#8e211b; --green:#2f6b45; --gold:#e9b949;
  --panel:#fffaf0; --shadow:0 10px 30px rgba(40,20,10,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1c1410;color:var(--ink);font-family:Fredoka,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
img{user-select:none;-webkit-user-drag:none}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,179.1vh);aspect-ratio:1920/1072;background:#2a1d16 url(art/room.webp) center/cover;overflow:hidden;border-radius:6px;container-type:inline-size}
/* window sky darkens as Wigilia approaches */
#dusk{position:absolute;left:42%;top:16.5%;width:22.5%;height:37%;background:#0a1030;mix-blend-mode:multiply;opacity:0;transition:opacity 1.5s;pointer-events:none}
#star{position:absolute;left:54.5%;top:25%;width:5%;aspect-ratio:1;border:0;background:none;padding:0;cursor:pointer;border-radius:50%}
#star svg{width:100%;height:100%;animation:starTw 3.4s ease-in-out infinite}
#star .rays{transform-origin:50% 50%;animation:starRot 9s ease-in-out infinite}
@keyframes starTw{0%,100%{opacity:.85;transform:scale(.92)}23%{opacity:1;transform:scale(1.05)}41%{opacity:.8;transform:scale(.95)}67%{opacity:1;transform:scale(1.1)}83%{opacity:.88;transform:scale(.97)}}
@keyframes starRot{50%{transform:rotate(8deg)}}
#star:hover svg,#star:focus-visible svg{filter:drop-shadow(0 0 .8cqw #fff)}
/* room objects */
.obj{position:absolute;border:0;background:none;padding:0;cursor:pointer;transition:filter .2s,transform .2s}
.obj img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .8s}
.obj:hover,.obj:focus-visible{filter:drop-shadow(0 0 .6cqw #fff3a0) drop-shadow(0 0 .3cqw #ffd34e);outline:none}
.obj .tag{position:absolute;left:50%;top:-1.2cqw;transform:translate(-50%,-100%);background:rgba(255,250,240,.95);color:var(--ink);font-weight:700;font-size:1.25cqw;padding:.25em .7em;border-radius:99px;white-space:nowrap;opacity:0;transition:opacity .2s;box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none}
.obj:hover .tag,.obj:focus-visible .tag{opacity:1}
.obj .todo{position:absolute;right:8%;top:6%;width:2.2cqw;height:2.2cqw;border-radius:50%;background:var(--red);color:#fff;font-size:1.3cqw;display:grid;place-items:center;font-weight:700;box-shadow:0 0 0 .25cqw #fff;animation:bob 1.6s ease-in-out infinite}
.obj.done .todo{display:none}
@keyframes bob{50%{transform:translateY(-.4cqw)}}
#oTree{left:.5%;bottom:10%;width:26%;height:68%}
#oFire{left:16.5%;top:42%;width:21.5%;height:34%}
#oMik{left:11.5%;bottom:2%;width:22%;aspect-ratio:900/746;z-index:3}
#oMik img{filter:drop-shadow(0 .4cqw .6cqw rgba(0,0,0,.35))}
#oMik .todo{right:30%;top:0}
#presents{position:absolute;left:4%;bottom:9%;width:15%;z-index:2;pointer-events:none;filter:drop-shadow(0 .3cqw .5cqw rgba(0,0,0,.3))}
.trainCv{background:#b98352;touch-action:none;width:auto!important;max-width:100%;max-height:min(52vh,460px);margin:0 auto}
.tpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,46px);gap:6px;justify-content:center;margin-top:8px}
.tpad button{border:0;border-radius:12px;background:var(--green);color:#fff;font-size:22px;box-shadow:0 3px 0 #1d4a2e;touch-action:none}
.tpad [data-d=up]{grid-column:2}.tpad [data-d=left]{grid-column:1;grid-row:2}.tpad [data-d=down]{grid-column:2;grid-row:2}.tpad [data-d=right]{grid-column:3;grid-row:2}
#oFire .tag{top:1cqw}
#lightsMantel{position:absolute;left:16%;top:40.5%;width:23%;pointer-events:none;z-index:2}
#lightsWindow{position:absolute;left:36.5%;top:10.5%;width:33%;pointer-events:none;z-index:2}
.twinkle{animation:tw 2.7s linear infinite}
#lightsWindow.twinkle{animation-duration:3.3s;animation-delay:-1.1s}
@keyframes tw{0%{filter:brightness(1) drop-shadow(0 0 .25cqw #ffe9a0)}9%{filter:brightness(1.45) drop-shadow(0 0 .9cqw #ffd77a)}17%{filter:brightness(1.05) drop-shadow(0 0 .3cqw #ffe9a0)}31%{filter:brightness(1.3) drop-shadow(0 0 .7cqw #ffe9a0)}38%{filter:brightness(.92) drop-shadow(0 0 .2cqw #ffe9a0)}55%{filter:brightness(1.5) drop-shadow(0 0 1cqw #ffcf6a)}63%{filter:brightness(1.1) drop-shadow(0 0 .4cqw #ffe9a0)}79%{filter:brightness(1.35) drop-shadow(0 0 .8cqw #ffe9a0)}88%{filter:brightness(.97) drop-shadow(0 0 .25cqw #ffe9a0)}100%{filter:brightness(1) drop-shadow(0 0 .25cqw #ffe9a0)}}
#treeDeco{animation:treeglow 3.1s linear infinite}
@keyframes treeglow{0%,100%{filter:brightness(1)}18%{filter:brightness(1.12) drop-shadow(0 0 .6cqw rgba(255,220,130,.6))}35%{filter:brightness(1.02)}52%{filter:brightness(1.16) drop-shadow(0 0 .8cqw rgba(255,220,130,.7))}70%{filter:brightness(1.04)}86%{filter:brightness(1.1) drop-shadow(0 0 .5cqw rgba(255,220,130,.5))}}
#snowWin{position:absolute;left:42%;top:16.5%;width:22.5%;height:37%;pointer-events:none}
#snowWin,#dusk{-webkit-mask:url(art/window_mask.png) 0 0/100% 100% no-repeat;mask:url(art/window_mask.png) 0 0/100% 100% no-repeat}
#fireglow{position:absolute;left:20%;top:49%;width:16%;height:28%;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(ellipse at 50% 62%,rgba(255,180,70,.6),rgba(255,120,30,.28) 42%,transparent 70%);animation:fire 2.3s infinite}
@keyframes fire{0%{opacity:.7;transform:scale(1)}11%{opacity:1;transform:scale(1.06)}24%{opacity:.74;transform:scale(.99)}37%{opacity:.95;transform:scale(1.03)}49%{opacity:.62;transform:scale(.97)}63%{opacity:1;transform:scale(1.05)}77%{opacity:.8}90%{opacity:.92;transform:scale(1.02)}100%{opacity:.7;transform:scale(1)}}
#kzSofa{transform-origin:40% 100%;animation:breathe 3.8s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.012)}}
#snowTitle{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#snowWin,#snowTitle{background:none!important;border-radius:0!important}
#title>*:not(canvas){position:relative}
#oSofa{left:41.5%;top:42.5%;width:23%;height:29%}
#oSofa .tag{top:1cqw}
#zzz{position:absolute;left:30%;top:-2%;font-size:2.4cqw;font-weight:700;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);animation:zz 2.4s ease-in-out infinite;pointer-events:none}
@keyframes zz{0%{opacity:0;transform:translateY(.5cqw)}50%{opacity:1}100%{opacity:0;transform:translateY(-1.5cqw)}}
#oSideboard{left:66%;top:38%;width:17%;height:41%}
#cookies{position:absolute;left:66.5%;top:47.5%;width:6.5%;pointer-events:none;z-index:2}
#oKitchen{left:84.5%;top:9%;width:15.5%;height:70%}
#oKitchen .tag{top:3cqw}
#oTable{left:45%;bottom:-5%;width:41%;height:42%}
#oTree .tag{top:auto;bottom:-1cqw;transform:translate(-50%,100%)}
#kaka{position:absolute;right:.5%;bottom:-2%;height:74%;pointer-events:none;filter:drop-shadow(0 .6cqw .8cqw rgba(0,0,0,.35));z-index:4}
#kaka{transform-origin:50% 100%;animation:kIdle 4.6s ease-in-out infinite}
@keyframes kIdle{0%,100%{transform:rotate(0) scaleY(1)}25%{transform:rotate(-.7deg) scaleY(1.007)}50%{transform:rotate(0) scaleY(1)}75%{transform:rotate(.7deg) scaleY(1.007)}}
#kaka.talk{animation:kTalk .42s ease-in-out infinite alternate}
@keyframes kTalk{from{transform:translateY(0) rotate(-1.2deg)}to{transform:translateY(-1%) rotate(1.2deg) scaleY(1.01)}}
#kaka.cheer{animation:kHop .5s ease-out 4}
@keyframes kHop{0%,100%{transform:translateY(0) scaleY(1)}35%{transform:translateY(-7%) scaleY(1.03)}70%{transform:translateY(0) scaleY(.96)}}
/* checklist */
#list{position:absolute;left:1.2%;top:2.5%;width:21%;background:#fffdf6;border-radius:.8cqw;padding:.9cqw 1.1cqw;box-shadow:var(--shadow);font-size:1.25cqw;transform:rotate(-1.5deg);z-index:5}
#list{width:auto!important;min-width:12%;padding:.5cqw .9cqw!important}
#listToggle{border:0;background:none;font:inherit;font-weight:700;color:var(--red);font-size:1.2em;padding:.2em 0;display:flex;gap:.4em;align-items:center;cursor:pointer}
#listToggle b{color:var(--ink);font-weight:600;font-size:.85em}
#listToggle .chev{transition:transform .2s;color:var(--ink)}
#list.open #listToggle .chev{transform:rotate(180deg)}
#list:not(.open) #tasks{display:none}
#list button{display:flex;align-items:center;gap:.5em;width:100%;text-align:left;border:0;background:none;padding:.2em .1em;color:var(--ink);font-size:1em;border-radius:6px}
#list button:hover{background:#f6ead3}
#list .box{width:1.1em;height:1.1em;border:2px solid var(--ink);border-radius:4px;flex:none;display:grid;place-items:center;font-size:.8em;color:var(--green)}
#list .ok{text-decoration:line-through;opacity:.6}
#starhint{position:absolute;left:52%;top:3%;transform:translateX(-50%);background:var(--gold);color:var(--ink);padding:.4em 1em;border-radius:20px;font-weight:700;font-size:1.5cqw;box-shadow:var(--shadow);animation:bobx 1.6s ease-in-out infinite;z-index:5}
@keyframes bobx{50%{transform:translate(-50%,-6px)}}
#mute{position:absolute;right:1%;top:2%;z-index:10;border:0;background:rgba(255,250,240,.9);border-radius:50%;width:2.6em;height:2.6em;font-size:1.3cqw}
/* dialogue */
#dlg{position:absolute;left:3%;right:3%;bottom:3%;display:flex;gap:2%;align-items:center;background:rgba(255,250,240,.97);border-radius:1.2cqw;padding:1.2% 2%;box-shadow:var(--shadow);font-size:1.7cqw;cursor:pointer;z-index:20}
#dlg .face{width:8.5%;aspect-ratio:1;border-radius:50%;background:#f1dfc0 no-repeat;flex:none;border:.25cqw solid var(--red)}
#dlg .who{font-weight:700;color:var(--red);margin-bottom:.15em}
#dlg .next{margin-left:auto;font-size:.8em;opacity:.6;white-space:nowrap}
/* overlays */
.ov{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(20,12,8,.65);padding:12px}
.card{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);width:min(960px,100%);max-height:100%;overflow:auto;padding:18px 20px;position:relative}
.card h2{margin:0 0 4px;color:var(--red);font-size:clamp(20px,3vw,30px);padding-right:40px}
.card .sub{margin:0 0 12px;opacity:.8}
.x{position:absolute;right:12px;top:10px;border:0;background:#efe2c9;border-radius:50%;width:36px;height:36px;font-size:18px}
.btn{background:var(--red);color:#fff;border:0;border-radius:999px;padding:.6em 1.4em;font-weight:600;font-size:clamp(15px,2vw,20px);box-shadow:0 4px 0 var(--red-d)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--red-d)}
.btn.alt{background:var(--green);box-shadow:0 4px 0 #1d4a2e}
.msg{min-height:1.5em;font-weight:600;color:var(--green);margin-top:8px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* title */
#title{background:#0d1426 url(art/title.webp) center/cover;flex-direction:column;justify-content:space-between;color:#fff;text-align:center;padding:4vh 16px 5vh}
#title::before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(6,10,28,.72) 0%,rgba(6,10,28,.15) 32%,rgba(6,10,28,0) 55%,rgba(6,10,28,.55) 82%,rgba(6,10,28,.85) 100%);pointer-events:none}
.tLogo{display:flex;flex-direction:column;align-items:center;line-height:.9;animation:logoIn 1.2s cubic-bezier(.2,.8,.2,1) both}
.tLogo .tSmall{font-family:Lobster,cursive;font-size:clamp(22px,3.6vw,46px);color:#ffe9a8;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.tLogo .tBig{font-family:Lobster,cursive;font-size:clamp(64px,12vw,150px);color:#fff6dc;text-shadow:0 .05em 0 #8e211b,0 .09em 0 #5e140f,0 0 .4em rgba(255,214,130,.55);letter-spacing:.01em}
.tLogo .tStar{font-size:.35em;color:#ffe9a8;vertical-align:super;animation:spark 2.4s ease-in-out infinite;display:inline-block}
@keyframes spark{50%{opacity:.4;transform:scale(.7) rotate(20deg)}}
@keyframes logoIn{from{opacity:0;transform:translateY(-18px) scale(.96)}}
.tBottom{display:flex;flex-direction:column;align-items:center;gap:12px;animation:logoIn 1.2s .3s cubic-bezier(.2,.8,.2,1) both}
.tTag{margin:0;max-width:600px;font-size:clamp(14px,1.9vw,19px);text-shadow:0 1px 6px #000;opacity:.95}
.tBtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#title .btn{font-size:clamp(17px,2.2vw,22px);padding:.65em 1.8em}
.tProg{margin:0;font-size:14px;opacity:.85;text-shadow:0 1px 4px #000}
/* minigames */
canvas{display:block;width:100%;border-radius:12px;background:linear-gradient(#fff6e5,#f0d9b0);touch-action:none}
.bar{height:16px;background:#ecdcbf;border-radius:10px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),#56a46f);transition:width .2s}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (min-width:700px){.grid{grid-template-columns:repeat(6,1fr)}}
.mc{aspect-ratio:4/5;border:0;border-radius:12px;color:var(--ink);font-size:clamp(11px,1.5vw,15px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;transition:transform .25s;
  background:var(--red) radial-gradient(circle at 50% 50%,#d4483d 0 30%,transparent 31%) center/34px 34px;box-shadow:0 4px 0 var(--red-d),inset 0 0 0 4px #e9b949}
.mc .back{font-size:2em;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.mc img{width:88%;height:68%;object-fit:contain}
.mc.up{background:#fff;box-shadow:0 4px 0 #d9c7a5,inset 0 0 0 3px #f0e2c4}
.mc.got{background:#fdf0c9;box-shadow:inset 0 0 0 3px var(--gold);opacity:.85}
.choices{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.chip{border:0;background:#fff;border-radius:14px;padding:.6em 1em;font-size:clamp(15px,2vw,20px);box-shadow:0 3px 0 #d9c7a5}
.stack{display:flex;gap:8px;flex-wrap:wrap;min-height:46px;justify-content:center;align-items:center;background:#f5e7cc;border-radius:12px;padding:8px}
.stack span{background:#fff;border-radius:10px;padding:.3em .7em}
.seatplan{position:relative;width:min(540px,100%);aspect-ratio:16/9;margin:40px auto 52px}
.seatplan .stol{position:absolute;left:20%;right:20%;top:28%;bottom:28%;background:#fffdf6;border:4px solid #8a5a3a;border-radius:14px;box-shadow:inset 0 0 0 6px #f3e6c8,0 6px 14px rgba(0,0,0,.2);display:grid;place-items:center;font-size:clamp(18px,3vw,28px)}
.seatplan .side{position:absolute;pointer-events:none;font-size:clamp(11px,1.6vw,14px);font-weight:600;opacity:.75}
.s-top{left:50%;top:-14%;transform:translateX(-50%)}.s-bot{left:50%;bottom:-14%;transform:translateX(-50%)}
.s-l{left:-1%;top:22%}.s-r{right:-1%;top:22%}
.seat{position:absolute;transform:translate(-50%,-50%);width:clamp(58px,14%,80px);aspect-ratio:1;border-radius:50%;border:3px dashed #c9a877;background:#fff8ea;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;font-size:clamp(10px,1.4vw,13px);line-height:1.1}
.seat.taken{border-style:solid;border-color:var(--green);background:#fff}
.seat.sel,.chip.guest.sel{box-shadow:0 0 0 4px var(--gold)}
.seat .fc{width:3.3em;height:3.3em}
.chip.guest .fc{width:2.8em;height:2.8em}
.seat .free{font-size:22px;opacity:.5}
.seat b,.chip.guest b{font-weight:600}
.em{font-style:normal;font-size:1.7em;line-height:1}
.fc{display:inline-block;width:2.2em;height:2.2em;border-radius:50%;background-repeat:no-repeat;border:2px solid var(--red)}
.face-kaka{background-image:url(art/kaka.webp);background-size:250%;background-position:50% 1%}
.face-kaczor{background-image:url(art/kaczor.webp);background-size:330%;background-position:21% 0%}
.face-jugo{background:#fff url(art/guest/jugo.webp) 50% 22%/150% no-repeat}
.face-gayzilla{background:#fff url(art/guest/gayzilla.webp) 50% 18%/150% no-repeat}
.face-inez{background:#fff url(art/guest/inez.webp) 58% 22%/150% no-repeat}
.face-q{background:radial-gradient(circle at 50% 40%,#5b3a7a,#2a1840);position:relative}
.face-q::after{content:'?';position:absolute;inset:0;display:grid;place-items:center;color:#ffe9a8;font-weight:700;font-size:1.5em;font-style:normal;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.face-mikolaj{background-image:url(art/mikolaj.webp);background-size:280%;background-position:53% 6%;background-color:#fff}
.chip.guest{display:flex;flex-direction:column;align-items:center;gap:2px;padding:.4em .7em;font-size:clamp(12px,1.6vw,15px)}
.allin{opacity:.7;font-weight:600}
.rules{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:4px;font-size:clamp(13px,1.6vw,15px)}
.rules li{display:flex;gap:.5em;align-items:baseline;background:#f8eed9;border-radius:8px;padding:.3em .6em}
.rules li span{font-weight:700;width:1em;flex:none}
.rules li.ok{background:#e3f1e2}.rules li.ok span{color:var(--green)}
.rules li.bad{background:#fbe1dd}.rules li.bad span{color:var(--red)}
.tablepic{display:block;width:min(520px,90%);margin:0 auto}
#treeSvg{width:min(340px,75%);display:block;margin:0 auto}
.bb{cursor:pointer;transition:filter .15s}
.bb.on{filter:brightness(1.9) drop-shadow(0 0 10px #fff6a0)}
.lwrap{display:flex;gap:12px;align-items:center}
.lwrap canvas{flex:3;min-width:0;background:radial-gradient(ellipse at 50% 40%,#3b2a4a,#1e1630);}
.lwrap .kzWrap{flex:1;width:auto;max-width:240px;padding-top:44px}
.lwrap .kzWrap .bub{left:50%;top:0;transform:translateX(-50%);font-size:clamp(14px,1.8vw,19px);white-space:nowrap}
@media (max-width:640px){.lwrap{flex-direction:column}.lwrap .kzWrap{max-width:200px}}
.kzWrap{position:relative;width:min(520px,90%);margin:0 auto;cursor:pointer;user-select:none}
.kzWrap img{width:100%;display:block;transition:filter .3s}
.kzWrap.sleep img{filter:brightness(.75) saturate(.8)}
.kzWrap .bub{position:absolute;left:18%;top:-4%;background:#fff;border-radius:16px;padding:.2em .6em;font-weight:700;font-size:clamp(18px,3vw,30px);box-shadow:0 3px 10px rgba(0,0,0,.25)}
#end{background:#0d1426;overflow:hidden;padding:0;flex-direction:column;justify-content:space-between;color:#fff;text-align:center}
.endBg{position:absolute;left:50%;top:50%;width:max(100vw,178.6vh);height:max(100vh,56vw);transform:translate(-50%,-50%);background:url(art/wigilia.webp) center/100% 100% no-repeat;animation:kenburns 26s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-47%,-51%) scale(1.09)}}
.endGlow{position:absolute;left:68.2%;top:15.3%;width:5%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#fff 0 6%,rgba(255,250,220,.75) 14%,rgba(200,215,255,.25) 40%,transparent 70%);animation:starTw 3s ease-in-out infinite;mix-blend-mode:screen}
#end::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(6,10,28,.55),rgba(6,10,28,0) 30%,rgba(6,10,28,0) 52%,rgba(6,10,28,.8));pointer-events:none}
#snowEnd{position:absolute;inset:0;width:100%;height:100%;background:none!important;border-radius:0!important;pointer-events:none;z-index:1}
.endTop,.endCard{position:relative;z-index:2}
.endTop{padding-top:4vh}
.endTop h1{font-family:Lobster,cursive;font-weight:400;font-size:clamp(52px,9vw,120px);margin:0;color:#fff6dc;text-shadow:0 .05em 0 #8e211b,0 .09em 0 #5e140f,0 0 .5em rgba(255,214,130,.6);animation:logoIn 1.4s .2s both}
.endTop .from{font-family:Lobster,cursive;font-size:clamp(18px,2.6vw,30px);color:#ffe9a8;margin:.2em 0 0;text-shadow:0 2px 8px #000;animation:logoIn 1.4s .6s both}
.endCard{margin:0 auto 4vh;width:min(760px,calc(100% - 32px));background:rgba(12,16,36,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,233,168,.25);border-radius:18px;padding:16px 18px;animation:logoIn 1.2s 1s both}
.endList{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.endList li{background:rgba(255,246,220,.12);border:1px solid rgba(255,233,168,.3);border-radius:99px;padding:.3em .8em;font-size:clamp(12px,1.6vw,15px);opacity:0;animation:chipIn .5s both}
.endList li::before{content:'✔ ';color:#9be3a8;font-weight:700}
@keyframes chipIn{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
#endTxt{margin:0 0 12px;font-size:clamp(14px,1.8vw,17px);line-height:1.45;opacity:.95}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="stage" aria-label="Salon Kaki">
    <div id="dusk"></div>
    <canvas id="snowWin" aria-hidden="true"></canvas>
    <div id="fireglow" aria-hidden="true"></div>
    <button id="star" class="hidden" aria-label="Pierwsza gwiazdka"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="sg"><stop offset="0" stop-color="#fff"/><stop offset=".12" stop-color="#fffbe8" stop-opacity=".95"/><stop offset=".35" stop-color="#dfe8ff" stop-opacity=".28"/><stop offset="1" stop-color="#dfe8ff" stop-opacity="0"/></radialGradient></defs><circle cx="50" cy="50" r="50" fill="url(#sg)"/><g class="rays" fill="#fff"><path d="M50 6 L51.2 48.8 L94 50 L51.2 51.2 L50 94 L48.8 51.2 L6 50 L48.8 48.8Z" opacity=".75"/><path d="M50 26 L50.7 49.3 L74 50 L50.7 50.7 L50 74 L49.3 50.7 L26 50 L49.3 49.3Z" opacity=".5" transform="rotate(45 50 50)"/></g><circle cx="50" cy="50" r="4.5" fill="#fff"/></svg></button>
    <img id="lightsWindow" class="hidden twinkle" src="art/lights.webp" alt="">

    <button class="obj" id="oTree" data-task="tree" aria-label="Choinka"><img id="treeBare" src="art/tree_bare.webp" alt=""><img id="treeDeco" src="art/tree_deco.webp" alt="" style="opacity:0"><span class="tag">🎄 Choinka</span><span class="todo">!</span></button>
    <img id="presents" class="hidden" src="art/presents.webp" alt="Prezenty pod choinką">
    <button class="obj" id="oMik" data-task="train" aria-label="Mikołaj: pociąg"><img src="art/mikolaj.webp" alt="Mikołaj bawi się kolejką"><span class="tag">🚂 Pociąg Mikołaja</span><span class="todo">!</span></button>
    <button class="obj" id="oFire" data-task="lights" aria-label="Kominek: lampki"><span class="tag">💡 Lampki z Kaczorem</span><span class="todo">!</span></button>
    <img id="lightsMantel" class="hidden twinkle" src="art/lights.webp" alt="">
    <button class="obj" id="oSofa" aria-label="Kaczor na kanapie"><img id="kzSofa" src="art/kaczor_sleep.webp" alt=""><span id="zzz">Zzz</span><span class="tag">💬 Kaczor</span></button>
    <button class="obj" id="oSideboard" data-task="dishes" aria-label="Kredens: przepisy"><span class="tag">📖 Dwanaście potraw</span><span class="todo">!</span></button>
    <img id="cookies" class="hidden" src="art/cookies.webp" alt="Pierniczki">
    <button class="obj" id="oKitchen" data-task="bake" aria-label="Kuchnia: pierniczki"><span class="tag">🍪 Kuchnia</span><span class="todo">!</span></button>
    <button class="obj" id="oTable" data-task="table" aria-label="Stół wigilijny"><img id="tableEmpty" src="art/table_empty.webp" alt=""><img id="tableSet" src="art/table_set.webp" alt="" style="opacity:0"><span class="tag">🍽️ Stół</span><span class="todo">!</span></button>
    <img id="kaka" src="art/kaka.webp" alt="Kaka">

    <div id="list" aria-label="Lista Kaki"><button id="listToggle" aria-expanded="false">📋 Lista Kaki <b id="listCount">0/6</b> <span class="chev">▾</span></button><div id="tasks"></div></div>
    <div id="starhint" class="hidden">⭐ Spójrz w okno!</div>
    <button id="mute" title="Dźwięk">🔊</button>
    <div id="dlg" class="hidden"><div class="face"></div><div><div class="who"></div><div class="txt"></div></div><div class="next">dalej ▸</div></div>
  </div>
</div>

<div id="title" class="ov">
  <canvas class="snow" id="snowTitle" aria-hidden="true"></canvas>
  <div class="tLogo" role="heading" aria-level="1"><span class="tSmall">Świąteczna przygoda</span><span class="tBig">Kaki<span class="tStar">✦</span></span></div>
  <div class="tBottom">
    <p class="tTag">Józefosław, tuż przed świętami. Kaka ma listę zadań, synka z kolejką i męża, który zaprzyjaźnił się z kanapą. Święta będą idealne — choćby nie wiem co.</p>
    <div class="tBtns"><button class="btn" id="startBtn">Zaczynamy! 🎄</button><button class="btn alt hidden" id="resetBtn">Od nowa</button></div>
    <p class="tProg hidden" id="tProg"></p>
  </div>
</div>

<div id="game" class="ov hidden"><div class="card" id="gameCard"></div></div>

<div id="end" class="ov hidden">
  <div class="endBg" role="img" aria-label="Wigilia u Kaki: rodzina przy oknie patrzy na pierwszą gwiazdkę"><div class="endGlow"></div></div>
  <canvas id="snowEnd" aria-hidden="true"></canvas>
  <div class="endTop"><h1>Wesołych Świąt!</h1><p class="from">— Kaka, Kaczor i Mikołaj</p></div>
  <div class="endCard">
    <ul class="endList" id="endList"></ul>
    <p id="endTxt"></p>
    <button class="btn" id="againBtn">Zagraj jeszcze raz</button>
  </div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const TASKS=[
  {id:'bake',  name:'Upiec pierniczki'},
  {id:'tree',  name:'Ubrać choinkę'},
  {id:'dishes',name:'Dwanaście potraw'},
  {id:'table', name:'Nakryć do stołu'},
  {id:'lights',name:'Lampki (z Kaczorem)'},
  {id:'train', name:'Pociąg z Mikołajem'},
];
const LINES={
  intro:['kaka','Kaczor! Święta tuż-tuż, a my mamy jedną listę i zero pierniczków. Święta będą idealne. Choćby nie wiem co.'],
  kaczor_intro:['kaczor','Mhm. Idealne. Obudź mnie na karpia.'],
  hub:['kaka','Wybierz zadanie, jakiekolwiek! No dobra… wszystkie sześć.'],
  train:['kaka','Mikołaj, kochanie, prezenty rozjechały się po całym salonie! Poprowadź pociąg i zbierz je wszystkie pod choinkę. Tylko nie wjedź w kanapę taty!'],
  bake:['kaka','Pierniczki! Łap miód, mąkę i przyprawy. Nie skarpetki. Skąd tu się wzięły skarpetki?'],
  tree:['kaka','Choinka jest taka goła. Powieś bombki tam, gdzie błyszczą!'],
  dishes:['kaka','Dwanaście potraw na Wigilię. Znajdź pary, zanim przyjdą goście! Bo kochanek Inez podobno je za trzech.'],
  table:['kaka','Sianko pod obrus, opłatek na wierzch i jeden talerz więcej dla niespodziewanego gościa. W tym roku wiemy, kto to będzie… Inez przyprowadza swojego nieoczekiwanego, aktualnego… kochanka. Nie pytajcie, jak ma na imię. Ona też jeszcze nie jest pewna.'],
  lights:['kaka','Kaczor rozplątuje lampki. Pod nadzorem. Za każdym razem, jak przyśnie, obudź go!'],
  kaczor_awake:['kaczor','Nie śpię. Naprawdę nie śpię. Tylko oczy mi odpoczywają.'],
  done:['kaka','Gotowe! Pięknie! Kaczor, patrz! … Nie patrzy.'],
  retry:['kaka','Spokojnie! Święta wszystko wybaczą. Spróbuj jeszcze raz.'],
  star:['kaka','Kaczor… patrz. Pierwsza gwiazdka. Wesołych Świąt, kochanie.'],
  kaczor_star:['kaczor','Wesołych Świąt. … To co… już karp?'],
  kz1:['kaczor','Nie śpię. Ja tylko… testuję kanapę. Przed świętami musi być sprawdzona.'],
  kz2:['kaczor','Kochanie, ja też mam listę. Punkt pierwszy: odpocząć. Punkt drugi: patrz punkt pierwszy.'],
  kz3:['kaczor','Karp jest dopiero w Wigilię? To obudź mnie w Wigilię.'],
  kz4:['kaczor','Jeśli nie będę się ruszał… Kaka mnie nie zauważy.'],
  kz5:['kaczor','Przecież pomagam. Pilnuję kanapy, żeby nikt jej nie ukradł przed świętami.'],
  kz6:['kaczor','Mikołaj, pociąg jedzie za szybko. … Nie, nie wstanę. Tylko mówię.'],
};
// portrait crops: [image, background-size, background-position]
const FACES={kaka:['art/kaka.webp','250%','50% 1%'],kaczor:['art/kaczor.webp','330%','21% 0%']};
const NAMES={kaka:'Kaka',kaczor:'Kaczor'};

let done={}; try{done=JSON.parse(localStorage.getItem('kaka-done')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('kaka-done',JSON.stringify(done))}catch(e){}};
let muted=false, cur=null;
// background music: loops quietly, dips while someone is talking
const bgm=new Audio('audio/music.mp3'); bgm.loop=true; bgm.preload='auto';
const BGM_VOL=.32, BGM_DUCK=.1; let bgmTarget=BGM_VOL; bgm.volume=BGM_VOL;
setInterval(()=>{ const v=bgm.volume, d=bgmTarget-v; if(Math.abs(d)>.005) bgm.volume=Math.max(0,Math.min(1,v+Math.sign(d)*.02)); },40);
function startMusic(){ if(!muted) bgm.play().catch(()=>{}); }
function duck(on){ bgmTarget=on?BGM_DUCK:BGM_VOL; }
function play(key){ if(cur){cur.pause();cur=null} if(muted) return; const a=new Audio('audio/'+key+'.mp3'); cur=a;
  duck(true); const up=()=>{ if(cur===a||!cur) duck(false); }; a.onended=up; a.onpause=up; a.onerror=up;
  a.play().catch(up); return a; }
$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'🔇':'🔊'; if(muted){ if(cur)cur.pause(); bgm.pause(); } else startMusic(); };

// dialogue queue
let dq=[], dcb=null;
function say(keys,cb){ dq=keys.slice(); dcb=cb; nextLine(); }
function nextLine(){
  const d=$('#dlg');
  if(!dq.length){ d.classList.add('hidden'); if(cur)cur.pause(); $('#kaka').classList.remove('talk','cheer'); $('#kaka').src='art/kaka.webp'; const c=dcb; dcb=null; c&&c(); return; }
  const k=dq.shift(), [who,txt]=LINES[k], f=FACES[who], face=d.querySelector('.face');
  face.style.backgroundImage=`url("${f[0]}")`; face.style.backgroundSize=f[1]; face.style.backgroundPosition=f[2];
  const K=$('#kaka'); K.classList.remove('talk','cheer');
  if(who==='kaka'&&(k==='done'||k==='star')){ K.src='art/kaka_cheer.webp'; void K.offsetWidth; K.classList.add('cheer'); }
  else { K.src='art/kaka.webp'; if(who==='kaka') K.classList.add('talk'); }
  d.querySelector('.who').textContent=NAMES[who];
  d.querySelector('.txt').textContent=txt;
  d.classList.remove('hidden');
  play(k);
}
$('#dlg').onclick=nextLine;

// hub state
function render(){
  const t=$('#tasks'); t.innerHTML='';
  TASKS.forEach(task=>{
    const b=document.createElement('button');
    b.innerHTML=`<span class="box">${done[task.id]?'✔':''}</span><span class="${done[task.id]?'ok':''}">${task.name}</span>`;
    b.onclick=()=>open(task.id);
    t.appendChild(b);
  });
  $('#listCount').textContent=`${TASKS.filter(x=>done[x.id]).length}/${TASKS.length}`;
  const show=(sel,on)=>$(sel).classList.toggle('hidden',!on);
  show('#cookies',done.bake); show('#presents',done.train); show('#lightsMantel',done.lights); show('#lightsWindow',done.lights);
  $('#treeDeco').style.opacity=done.tree?1:0; $('#treeBare').style.opacity=done.tree?0:1;
  $('#tableSet').style.opacity=done.table?1:0; $('#tableEmpty').style.opacity=done.table?0:1;
  document.querySelectorAll('.obj[data-task]').forEach(o=>o.classList.toggle('done',!!done[o.dataset.task]));
  const all=TASKS.every(x=>done[x.id]);
  show('#star',all); show('#starhint',all);
  $('#dusk').style.opacity=TASKS.filter(x=>done[x.id]).length/TASKS.length*.7;
  $('#zzz').style.display=done.lights?'none':'';
  $('#kzSofa').src=done.lights?'art/kaczor.webp':'art/kaczor_sleep.webp';
}
document.querySelectorAll('.obj[data-task]').forEach(o=>o.addEventListener('click',()=>open(o.dataset.task)));
$('#star').addEventListener('click',ending);
$('#listToggle').onclick=()=>{ const o=$('#list').classList.toggle('open'); $('#listToggle').setAttribute('aria-expanded',o); };
let kzLine=0; $('#oSofa').addEventListener('click',()=>{ if(!$('#dlg').classList.contains('hidden')) return; say(['kz'+(kzLine%6+1)]); kzLine++; });

// ---------- minigame shell ----------
let stopGame=null;
function open(id){
  if(!$('#dlg').classList.contains('hidden')) return;
  const g=GAMES[id]; $('#game').classList.remove('hidden');
  const card=$('#gameCard'); card.innerHTML='';
  const x=document.createElement('button'); x.className='x'; x.textContent='✕'; x.title='Zamknij'; x.onclick=closeGame; card.appendChild(x);
  play(id);
  stopGame=g(card,()=>finish(id))||null;
}
function closeGame(){ if(stopGame)stopGame(); stopGame=null; $('#game').classList.add('hidden'); if(cur)cur.pause(); }
function finish(id){
  setTimeout(()=>{
    closeGame(); done[id]=true; save(); render();
    say(['done']);
  },1100);
}
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstElementChild;}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const loadImg=src=>{const i=new Image();i.src=src;return i;};

const GAMES={
// 1. catch ingredients
bake(card,win){
  card.append(el('<h2>🍪 Pierniczki</h2>'),el('<p class="sub">Przesuwaj miskę (palcem, myszką albo strzałkami). Złap 15 składników — omijaj skarpetki Kaczora!</p>'));
  const bar=el('<div class="bar"><i></i></div>'), cv=document.createElement('canvas'), msg=el('<div class="msg">&nbsp;</div>');
  card.append(bar,cv,msg);
  const W=800,H=460; cv.width=W; cv.height=H; const c=cv.getContext('2d');
  const GOOD=['miod','maka','jajko','maslo','orzechy'].map(n=>loadImg('art/ing/'+n+'.webp')), BAD=loadImg('art/ing/skarpetka.webp');
  let bx=W/2, items=[], score=0, raf, last=performance.now(), keys={}, over=false;
  const mv=e=>{const r=cv.getBoundingClientRect(); bx=(e.clientX-r.left)/r.width*W;};
  cv.addEventListener('pointermove',mv); cv.addEventListener('pointerdown',mv);
  const kd=e=>{keys[e.key]=e.type==='keydown'}; addEventListener('keydown',kd); addEventListener('keyup',kd);
  const S=64;
  function draw(img,x,y,rot){ if(!img.complete||!img.naturalWidth) return; const r=img.naturalWidth/img.naturalHeight, w=r>1?S:S*r, h=r>1?S/r:S;
    c.save(); c.translate(x,y); c.rotate(rot); c.drawImage(img,-w/2,-h/2,w,h); c.restore(); }
  function loop(now){
    const dt=Math.min(.05,(now-last)/1000); last=now;
    if(keys.ArrowLeft) bx-=600*dt; if(keys.ArrowRight) bx+=600*dt; bx=Math.max(70,Math.min(W-70,bx));
    if(!over && Math.random()<dt*1.6){ const bad=Math.random()<.22; items.push({x:50+Math.random()*(W-100),y:-40,v:150+Math.random()*90+score*6,img:bad?BAD:GOOD[Math.random()*GOOD.length|0],bad,rot:0,vr:(Math.random()-.5)*2}); }
    c.clearRect(0,0,W,H);
    items.forEach(it=>{ it.y+=it.v*dt; it.rot+=it.vr*dt; draw(it.img,it.x,it.y,it.rot);
      if(!it.hit && it.y>H-80 && it.y<H-20 && Math.abs(it.x-bx)<75){ it.hit=true;
        if(it.bad){ score=Math.max(0,score-1); msg.textContent='Skarpetka Kaczora! 🧦 −1'; msg.style.color='var(--red)'; }
        else { score++; msg.textContent=['Mniam!','Pięknie!','Jeszcze!','Tak trzymać!'][score%4]; msg.style.color='var(--green)'; }
      }});
    items=items.filter(it=>!it.hit&&it.y<H+50);
    // mixing bowl
    const g=c.createLinearGradient(0,H-70,0,H-10); g.addColorStop(0,'#d24a3f'); g.addColorStop(1,'#8e211b');
    c.fillStyle=g; c.beginPath(); c.moveTo(bx-80,H-62); c.quadraticCurveTo(bx-70,H-8,bx,H-8); c.quadraticCurveTo(bx+70,H-8,bx+80,H-62); c.closePath(); c.fill();
    c.fillStyle='#f6e7c8'; c.beginPath(); c.ellipse(bx,H-62,80,12,0,0,Math.PI*2); c.fill();
    c.strokeStyle='#e9b949'; c.lineWidth=4; c.beginPath(); c.moveTo(bx-62,H-40); c.quadraticCurveTo(bx,H-30,bx+62,H-40); c.stroke();
    bar.firstChild.style.width=Math.min(100,score/15*100)+'%';
    if(score>=15 && !over){ over=true; msg.textContent='Ciasto gotowe! 🍪'; win(); }
    raf=requestAnimationFrame(loop);
  }
  raf=requestAnimationFrame(loop);
  return ()=>{cancelAnimationFrame(raf); removeEventListener('keydown',kd); removeEventListener('keyup',kd);};
},
// 2. bauble sequence memory on the real tree
tree(card,win){
  card.append(el('<h2>🎄 Choinka</h2>'),el('<p class="sub">Patrz, które bombki zabłysną, i dotknij ich w tej samej kolejności. Trzy rundy.</p>'));
  const COL=['#c0392b','#2f6fd1','#e9b949','#d2569b','#2fa37a','#8a5ad2'];
  const POS=[[150,190],[108,265],[195,280],[85,370],[152,355],[220,385]];
  const svg=el(`<svg id="treeSvg" viewBox="0 0 300 490"><image href="art/tree_bare.webp" x="0" y="0" width="300" height="490" preserveAspectRatio="xMidYMid meet"/>
    ${POS.map((p,i)=>`<g class="bb" data-i="${i}"><circle cx="${p[0]}" cy="${p[1]}" r="21" fill="${COL[i]}" stroke="#fff6d8" stroke-width="3"/><circle cx="${p[0]-7}" cy="${p[1]-7}" r="5" fill="#fff" opacity=".7"/><rect x="${p[0]-4}" y="${p[1]-27}" width="8" height="7" fill="#e9b949"/></g>`).join('')}</svg>`);
  const msg=el('<div class="msg">Patrz uważnie…</div>');
  card.append(svg,msg);
  const balls=[...svg.querySelectorAll('.bb')];
  let round=0, seq=[], inp=0, busy=true, timers=[], dead=false;
  const LEN=[3,4,5];
  const flash=i=>{balls[i].classList.add('on'); timers.push(setTimeout(()=>balls[i].classList.remove('on'),420));};
  function show(){ busy=true; inp=0; msg.textContent=`Runda ${round+1}/3 — patrz uważnie…`; msg.style.color='var(--green)';
    seq.forEach((b,k)=>timers.push(setTimeout(()=>flash(b),700+k*650)));
    timers.push(setTimeout(()=>{busy=false;msg.textContent='Teraz Ty!';},700+seq.length*650));
  }
  function newRound(){ seq=Array.from({length:LEN[round]},()=>Math.random()*6|0); show(); }
  balls.forEach(b=>b.addEventListener('click',()=>{
    if(busy||dead) return; const i=+b.dataset.i; flash(i);
    if(i===seq[inp]){ inp++; if(inp===seq.length){ round++; if(round===3){ busy=true; msg.textContent='Choinka błyszczy! ✨'; svg.querySelector('image').setAttribute('href','art/tree_deco.webp'); win(); } else { msg.textContent='Brawo! Następna runda…'; busy=true; timers.push(setTimeout(newRound,900)); } } }
    else { msg.textContent='Ups, prawie! Pokażę jeszcze raz.'; msg.style.color='var(--red)'; svg.classList.add('shake'); setTimeout(()=>svg.classList.remove('shake'),400); busy=true; timers.push(setTimeout(show,1100)); }
  }));
  timers.push(setTimeout(newRound,2500));
  return ()=>{dead=true; timers.forEach(clearTimeout);};
},
// 3. memory pairs of the twelve dishes
dishes(card,win){
  const ALL=[['Barszcz','barszcz'],['Uszka','uszka'],['Pierogi','pierogi'],['Karp','karp'],['Śledź','sledz'],['Ryba po grecku','ryba'],['Kapusta z grochem','kapusta'],['Zupa grzybowa','grzybowa'],['Kutia','kutia'],['Makowiec','makowiec'],['Piernik','piernik'],['Kompot z suszu','kompot']];
  card.append(el('<h2>📖 Dwanaście potraw</h2>'),el('<p class="sub">Odkrywaj karty i znajdź pary. Dwie tury po sześć potraw.</p>'));
  const msg=el('<div class="msg">&nbsp;</div>'), grid=el('<div class="grid"></div>'); card.append(grid,msg);
  let part=0, open=[], lock=false, got=0, timers=[];
  const BACK='<span class="back">⭐</span>';
  function deal(){
    const set=ALL.slice(part*6,part*6+6); got=0; grid.innerHTML='';
    shuffle([...set,...set]).forEach(([n,f])=>{
      const b=el(`<button class="mc" aria-label="karta">${BACK}</button>`); b.dataset.n=n;
      b.onclick=()=>{ if(lock||b.classList.contains('up')||b.classList.contains('got')) return;

    for(let i=body.length-1;i>=1;i--){ const a=seg(i,t), b=seg(i-1,t); c.strokeStyle='#5a4a3a'; c.lineWidth=3; c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke(); }
    for(let i=body.length-1;i>=1;i--) drawWagon(seg(i,t),angle(i,t),i);
    drawLoco(seg(0,t),angle(0,t));
    if(crashFlash>0){ c.fillStyle=`rgba(255,80,60,${crashFlash})`; c.fillRect(0,0,W,H); } }
  function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; crashFlash=Math.max(0,crashFlash-dt);
    const speed=Math.max(.13,.24-got*.01);
    if(!over){ if(pause>0) pause-=dt; else { acc+=dt; while(acc>=speed){ acc-=speed; step(); if(pause>0||over){acc=0;break;} } } }
    render(over||pause>0?1:Math.min(1,acc/speed)); raf=requestAnimationFrame(loop); }
  msg.textContent='Ciuch-ciuch! Jedź po pierwszy prezent.';
  window.__train={state:()=>({head:body[0],gift,dir,len:body.length,got,COLS,ROWS,body})}; // read-only hook for automated play-tests
  raf=requestAnimationFrame(loop);
  return ()=>{ cancelAnimationFrame(raf); removeEventListener('keydown',kd); };
},
};

// ---------- ending ----------
function ending(){
  say(['star','kaczor_star'],()=>{
    $('#end').classList.remove('hidden');
    const items=['🍪 pierniczki','🎄 choinka','📖 12 potraw','🍽️ stół i goście','💡 lampki','🚂 prezenty'];
    $('#endList').innerHTML=items.map((t,i)=>`<li style="animation-delay:${1.4+i*.18}s">${t}</li>`).join('');
    $('#endTxt').textContent='Pierwsza gwiazdka zabłysła. Wszystko gotowe: Kaczor nawet nie zasnął przy barszczu (prawie), Mikołaj dowiózł prezenty pod choinkę, a nieoczekiwany kochanek Inez zjadł za trzech.';
  });
}
$('#againBtn').onclick=()=>{done={};save();render();$('#end').classList.add('hidden');say(['hub']);};

// ---------- title ----------
const started=Object.keys(done).length>0;
if(started){ $('#startBtn').textContent='Graj dalej 🎄'; $('#resetBtn').classList.remove('hidden'); const n=TASKS.filter(t=>done[t.id]).length; $('#tProg').textContent=`Gotowe: ${n} z ${TASKS.length} zadań`; $('#tProg').classList.remove('hidden'); }
$('#resetBtn').onclick=()=>{done={};save();render();go(true)};
$('#startBtn').onclick=()=>go(!started);
// falling snow (window and title screen); skipped for reduced-motion users
function snowfall(cv,count,size){ const c=cv.getContext('2d'); let W=0,H=0,flakes=[];
  function fit(){ const r=cv.getBoundingClientRect(), d=Math.min(2,devicePixelRatio||1); W=Math.max(1,r.width*d); H=Math.max(1,r.height*d); cv.width=W; cv.height=H;
    flakes=Array.from({length:count},()=>({x:Math.random()*W,y:Math.random()*H,r:(.6+Math.random()*1.6)*size*d,v:(.25+Math.random()*.6)*size*d,ph:Math.random()*6.28})); }
  fit(); addEventListener('resize',fit);
  let last=performance.now();
  (function tick(now){ const dt=Math.min(.05,(now-last)/1000)*60; last=now;
    if(!document.hidden && cv.offsetParent!==null){ const r=cv.getBoundingClientRect(), d=Math.min(2,devicePixelRatio||1); if(Math.abs(r.width*d-W)>2||Math.abs(r.height*d-H)>2) fit(); c.clearRect(0,0,W,H); c.fillStyle='rgba(255,255,255,.9)';
      for(const f of flakes){ f.y+=f.v*dt; f.ph+=.02*dt; f.x+=Math.sin(f.ph)*.35*size*dt; if(f.y>H+5){f.y=-5;f.x=Math.random()*W;}
        c.globalAlpha=.55+.45*(f.r/(2.2*size)); c.beginPath(); c.arc(f.x,f.y,f.r,0,6.283); c.fill(); }
      c.globalAlpha=1; }
    requestAnimationFrame(tick); })(last);
}
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){ snowfall($('#snowWin'),55,1); snowfall($('#snowTitle'),140,1.6); snowfall($('#snowEnd'),120,1.5); }
function go(fresh){ $('#title').classList.add('hidden'); startMusic(); render(); say(fresh?['intro','kaczor_intro','hub']:['hub']); }
render();
})();
</script>
