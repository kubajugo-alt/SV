<html lang="pl">
<head>
<meta charset="utf-8">

<meta property="og:title" content="Kaczor ucieka do sauny">
<meta property="og:description" content="Platformówka: Kaczor, Kaka, zalotne Inezy, morsowanie, paralotnia i sauna na końcu drogi.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Lobster&subset=latin-ext&display=swap" rel="stylesheet">
<style>
:root{--vw:1vw;--vh:1vh;--red:#c0392b;--ink:#2b1d14;--cream:#fff8ea;--green:#2f6b45}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d1426;color:var(--ink);font-family:'Baloo 2',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
#rot{position:fixed;left:0;top:0;width:calc(100*var(--vw));height:calc(100*var(--vh));overflow:hidden;display:flex;align-items:center;justify-content:center}
body.turned #rot{transform-origin:0 0;transform:translateX(var(--tx)) rotate(90deg)}
#stage{position:relative;width:min(calc(100*var(--vw)),calc(177.78*var(--vh)));aspect-ratio:16/9;container-type:inline-size;background:#000;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:5}
#title{background:#0d1426 url(art/title.webp) center/cover;justify-content:space-between;padding:2.5cqw 2cqw 3cqw}
#title::before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(6,10,28,.6),rgba(6,10,28,0) 35%,rgba(6,10,28,0) 60%,rgba(6,10,28,.75));pointer-events:none}
#title>*{position:relative}
.logo{font-family:Lobster,cursive;line-height:.9;color:#fff6dc;text-shadow:0 .05em 0 #8e211b,0 .09em 0 #5e140f,0 0 .4em rgba(0,0,0,.5)}
.logo small{display:block;font-size:2.6cqw;color:#ffe9a8;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.logo b{font-weight:400;font-size:7.5cqw}
.tBtns{display:flex;gap:1.2cqw;justify-content:center;flex-wrap:wrap}
.btn{background:var(--red);color:#fff;border:0;border-radius:999px;padding:.5em 1.4em;font-weight:700;font-size:max(15px,1.8cqw);box-shadow:0 .3cqw 0 #8e211b}
.btn.alt{background:var(--green);box-shadow:0 .3cqw 0 #1d4a2e}
.btn:active{transform:translateY(2px)}
.lvls{display:flex;gap:.5cqw;justify-content:center;margin-top:.8cqw;flex-wrap:wrap}.lvls button{border:0;border-radius:99px;background:rgba(255,248,234,.9);color:var(--ink);font-weight:700;font-size:max(12px,1.2cqw);padding:.2em .8em}.lvls button:disabled{opacity:.35}
.help{color:#fff;font-size:max(12px,1.35cqw);text-shadow:0 1px 4px #000;margin:.8cqw 0 0;line-height:1.4}
.card{background:rgba(255,248,234,.96);border-radius:1.6cqw;padding:2cqw 2.6cqw;max-width:62cqw;box-shadow:0 1cqw 3cqw rgba(0,0,0,.45)}
.card h2{font-family:Lobster,cursive;font-weight:400;color:var(--red);font-size:4cqw;margin:0 0 .4cqw}
.card p{margin:.4cqw 0 1.2cqw;font-size:max(14px,1.7cqw);line-height:1.35}
.card .face{width:9cqw;height:9cqw;border-radius:50%;margin:0 auto .8cqw;background:#f1dfc0 center/cover;border:.35cqw solid var(--red)}
.dim{background:rgba(6,10,28,.55)}
.card .who{font-size:max(11px,1.2cqw);font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#a0522d;margin-bottom:.2cqw}
.card p.narr{font-style:italic;color:#3b2a1e}
.card p.kq{font-size:max(12px,1.4cqw);color:#555;margin-top:-.4cqw}
#end{background:#0d1426 url(art/sauna_end.webp) center/cover}
#end .card,#sauna .card{margin-top:auto;margin-bottom:3cqw;background:rgba(255,248,234,.92)}
#sauna{background:#0d1426 center/cover}
#touch{position:absolute;inset:0;z-index:4;pointer-events:none}
#touch button{position:absolute;bottom:3%;width:9cqw;height:9cqw;border-radius:50%;border:.3cqw solid rgba(255,255,255,.7);background:rgba(20,20,40,.35);color:#fff;font-size:3.6cqw;pointer-events:auto;touch-action:none;display:grid;place-items:center}
#touch button.on{background:rgba(255,255,255,.35)}
#bL{left:3%}#bR{left:14%}#bT{right:15%}#bS{right:25.5%;bottom:14%!important}#bJ{right:3%;width:11cqw!important;height:11cqw!important}
#mute{position:absolute;right:1%;top:1.5%;z-index:6;border:0;background:rgba(255,250,240,.85);border-radius:50%;width:3.4cqw;height:3.4cqw;font-size:1.6cqw}
#back{position:absolute;left:1%;top:1.5%;z-index:6;color:#fff;font-size:max(11px,1.2cqw);text-decoration:none;background:rgba(6,10,28,.5);padding:.2em .8em;border-radius:99px}
</style>

<body>
<div id="rot">
<div id="stage">
  <canvas id="cv" width="1280" height="720" aria-label="Gra: Kaczor ucieka do sauny"></canvas>
  <div id="touch" class="hidden"><button id="bL" aria-label="W lewo">◀</button><button id="bR" aria-label="W prawo">▶</button><button id="bT" aria-label="Uderzenie">👊</button><button id="bS" aria-label="Rzuć śnieżką">❄</button><button id="bJ" aria-label="Skok">⤒</button></div>
  <button id="mute" title="Dźwięk">🔊</button>

  <div id="title" class="ov">
        <div class="logo"><small>Wielka ucieczka</small><b>Kaczor do sauny!</b></div>
    <div>
      <div class="tBtns"><button class="btn" id="play">Graj ▶</button><button class="btn alt hidden" id="fresh">Od początku</button></div>
      <div class="lvls" id="lvls"></div>
      <p class="help">◀ ▶ / A D — bieg · Spacja / ▲ — skok (przytrzymaj w powietrzu: <b>paralotnia</b>) · X / J — uderzenie · C / K — śnieżka<br>Uciekaj przed Kaką i jej listą zadań, unikaj całusów Inez, zbieraj witki do sauny 🌿</p>
    </div>
  </div>

  <div id="intro" class="ov dim hidden"><div class="card"><div class="face" id="iFace"></div><div class="who">Opowiada Jugo</div><h2 id="iName"></h2><p class="narr" id="iNarr"></p><p class="kq" id="iTxt"></p><button class="btn" id="iGo">Start!</button></div></div>
  <div id="over" class="ov dim hidden"><div class="card"><div class="face" style="background-image:url(art/kaka_face.webp)"></div><h2>Złapany!</h2><p id="oTxt"></p><button class="btn" id="oGo">Jeszcze raz</button></div></div>
  <div id="sauna" class="ov hidden"><div class="card"><h2 id="sName"></h2><p id="sTxt"></p><div class="tBtns"><button class="btn" id="sGo">Dalej ➜</button></div></div></div>
  <div id="end" class="ov hidden"><div class="card"><h2>Sauna! 🧖‍♂️🏳️‍🌈</h2><p id="eTxt"></p><div class="tBtns"><button class="btn" id="eAgain">Zagraj od nowa</button></div></div></div>
</div>
</div>
<script>
// ---------- phone held upright: turn the whole game sideways (same trick as the main game) ----------
(function(){ const root=document.documentElement, coarse=matchMedia('(pointer:coarse)');
  function orient(){ const w=innerWidth,h=innerHeight,on=coarse.matches&&h>w; document.body.classList.toggle('turned',on);
    root.style.setProperty('--vw',(on?h:w)/100+'px'); root.style.setProperty('--vh',(on?w:h)/100+'px'); root.style.setProperty('--tx',w+'px'); }
  addEventListener('resize',orient); addEventListener('orientationchange',()=>setTimeout(orient,250)); orient();
  if(coarse.matches) document.getElementById('touch').classList.remove('hidden'); })();

const $=s=>document.querySelector(s);
const cv=$('#cv'), c=cv.getContext('2d'), VW=1280, VH=720, T=48, ROWS=15;
const img=n=>{ const i=new Image(); i.src='art/'+n+'.webp'; return i; };
const ENV={}, ENVM={}; ['earth','forest','ice','cobble','snowpack','cave','pier','rock','wood'].forEach(s=>['plat','crum','mov'].forEach(k=>ENV[s+'_'+k]=img('env/'+s+'_'+k)));
['cp_on','cp_off','spring','spikes','icicle','vent'].forEach(n=>ENV[n]=img('env/'+n)); ['earth','forest','ice','cobble','snowpack','cave','pier','rock','wood'].forEach(s=>ENV['tex_'+s]=img('env/tex_'+s));
fetch('art/env/env.json').then(r=>r.json()).then(j=>Object.assign(ENVM,j)).catch(()=>{});
const envImg=n=>{ const i=ENV[n]; return i&&i.complete&&i.naturalWidth?i:null; };
const IMG={}; ['kz_idle','kz_run1','kz_run2','kz_run3','kz_run4','kz_jump','kz_fall','kz_punch','kz_wind','kz_throw','kz_glide','kz_towel','kz_twalk1','kz_twalk2','kz_tjoy','kaka_run1','kaka_run2','kaka_point','inez_walk1','inez_walk2','inez_kiss','it_vihta','it_ladle','it_snow','it_chore','it_kiss','it_phone','sauna','bg1','bg2','bg3','bg_birch','bg_market','bg_ski','bg_cave','bg_pier','bg_springs','bg_village','inez_hit','inez_dizzy','inez_huff','mar_idle','enemy_vac','enemy_note'].forEach(n=>IMG[n]=img(n));

// ---------- smooth animations (Ludo.ai spritesheets, packed into strips with a body anchor) ----------
const ANIM={}; fetch('art/anim/anim.json').then(r=>r.json()).then(j=>{ for(const k in j){ ANIM[k]=j[k]; ANIM[k].img=img('anim/'+k); } }).catch(()=>{});
function drawAnim(name,x,y,t,flip,prog){ const a=ANIM[name]; if(!a||!a.img.complete||!a.img.naturalWidth) return false;
  const f=prog!=null?Math.max(0,Math.min(a.n-1,Math.floor(prog*a.n))):a.loop?Math.floor(t*a.fps)%a.n:Math.min(a.n-1,Math.floor(t*a.fps));
  const sc=.5; c.save(); c.translate(x,y); if(flip) c.scale(-1,1); c.drawImage(a.img,f*a.w,0,a.w,a.h,-a.ax*sc,-a.h*sc,a.w*sc,a.h*sc); c.restore(); return true; }
// ---------- audio ----------
let muted=false, cur=null; const MUS=.3, MUS_DUCK=.07; const bgm=new Audio('audio/music.mp3'); bgm.loop=true; bgm.volume=MUS;
// dialogue: one line at a time, music ducked underneath; onend chains the next line of a conversation
function play(key,onend){ if(muted){ if(onend) onend(); return; } if(cur){ cur.onended=null; cur.pause(); } const a=new Audio('audio/'+key+'.mp3'); a.volume=1; cur=a; bgm.volume=MUS_DUCK; a.onended=()=>{ if(cur===a){ cur=null; bgm.volume=MUS; } if(onend) onend(); }; a.play().catch(()=>{ if(onend) onend(); }); }
// sound effects: ElevenLabs samples (audio/sfx) played through Web Audio, with the old synth beeps as a fallback while they load
let AC=null; const SB={}, SLAST={}, SFXN=['jump','punch','throw','splat','pick','ladle','hurt','defeat','phone','spring','cp','glide','splash','win','kz_jump1','kz_jump2','kz_jump3','kz_hurt1','kz_hurt2','kz_punch1','kz_throw1'];
// Kaczor's own grunts
let gruntT=0; function grunt(kind,ch=1){ const t=performance.now(); if(t-gruntT<450||Math.random()>ch) return; gruntT=t; const n={jump:['kz_jump1','kz_jump2','kz_jump3'],hurt:['kz_hurt1','kz_hurt2'],punch:['kz_punch1'],throw:['kz_throw1']}[kind]; sfx(n[Math.floor(Math.random()*n.length)],.7); }
const SYN={punch:'throw',splat:'pop',ladle:'life',hurt:'hit',defeat:'pop',phone:'pop',spring:'jump',cp:'life',glide:'jump',splash:'hit',win:'life'};
function initAudio(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); if(!SB._l){ SB._l=1; SFXN.forEach(n=>fetch('audio/sfx/'+n+'.mp3').then(r=>r.arrayBuffer()).then(b=>AC.decodeAudioData(b)).then(buf=>{ SB[n]=buf; }).catch(()=>{})); } }catch(e){} }
function sfx(type,vol=.55){ if(muted) return; initAudio(); const now=performance.now(); if(now-(SLAST[type]||0)<90) return; SLAST[type]=now; const b=SB[type]; if(b&&AC){ try{ const src=AC.createBufferSource(), g=AC.createGain(); src.buffer=b; g.gain.value=vol; src.connect(g).connect(AC.destination); src.start(); }catch(e){} return; } if(!type.startsWith('kz_')) synth(SYN[type]||type); }
function synth(type){ try{ const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain(); o.connect(g).connect(AC.destination);
  const S={jump:[['triangle',420,720,.12,.12]],pick:[['sine',880,1320,.09,.12]],hit:[['sawtooth',300,110,.25,.14]],throw:[['square',600,300,.08,.06]],pop:[['triangle',700,200,.18,.12]],life:[['sine',660,1320,.3,.14]]}[type][0];
  o.type=S[0]; o.frequency.setValueAtTime(S[1],t); o.frequency.exponentialRampToValueAtTime(S[2],t+S[3]); g.gain.setValueAtTime(S[4],t); g.gain.exponentialRampToValueAtTime(.001,t+S[3]+.05); o.start(t); o.stop(t+S[3]+.06); }catch(e){} }
$('#mute').onclick=e=>{ e.stopPropagation(); muted=!muted; $('#mute').textContent=muted?'🔇':'🔊'; if(muted){ bgm.pause(); if(cur) cur.pause(); } else bgm.play().catch(()=>{}); };

// ---------- levels: 10 worlds, each generated from hand-designed chunks (seeded, so every run is the same) ----------
// tiles: # ground   = one-way platform   c crumbling platform   w water (lake hole)
// entities: vihta, ladle, inez, spring, icicle; plus moving platforms, steam vents, wind zones, checkpoints, goal
function build(W){ const g=Array.from({length:ROWS},()=>Array(W).fill(' ')), L={W,g,ent:[],vents:[],cps:[],movs:[],winds:[],spikes:[],goal:0};
  const api={ L, ground:(a,b,top)=>{ for(let x=a;x<=b;x++) for(let y=top;y<ROWS;y++) g[y][x]='#'; },
    plat:(x,y,n,ch='=')=>{ for(let i=0;i<n;i++) if(x+i<W) g[y][x+i]=ch; },
    water:(a,b)=>{ for(let x=a;x<=b;x++) g[12][x]='w'; },
    v:(x,y,n=1,dx=1,dy=0)=>{ for(let i=0;i<n;i++) L.ent.push({k:'vihta',x:(x+i*dx)*T+T/2,y:(y+i*dy)*T+T/2}); },
    arc:(x,y,n,hh=2.2)=>{ for(let i=0;i<n;i++){ const t=i/(n-1||1); L.ent.push({k:'vihta',x:(x+i)*T+T/2,y:(y-Math.sin(t*Math.PI)*hh)*T+T/2}); } },
    ladle:(x,y)=>L.ent.push({k:'ladle',x:x*T+T/2,y:y*T+T/2}),
    inez:(x,a,b)=>L.ent.push({k:'inez',x:x*T,a:a*T,b:b*T}),
    gay:(x,a,b)=>L.ent.push({k:'gay',x:x*T,a:a*T,b:b*T}),
    vac:(x,a,b)=>L.ent.push({k:'vac',x:x*T,a:a*T,b:b*T}),
    spikes:(a,b,top)=>{ if(b>=a) L.spikes.push([a*T,(b+1)*T,top*T]); },
    spring:(x,top)=>L.ent.push({k:'spring',x:x*T+T/2,y:top*T}),
    icicle:(x)=>L.ent.push({k:'icicle',x:x*T+T/2,y:0}),
    mov:(x,y,w,ax,range,sp)=>L.movs.push({x0:x*T,y0:y*T,w:w*T,ax,range:range*T,sp,ph:0,x:x*T,y:y*T,dx:0,dy:0}),
    vent:x=>L.vents.push(x*T+T/2),
    wind:(a,b,f)=>L.winds.push([a*T,b*T,f]),
    cp:x=>L.cps.push(x*T) };
  return api; }
function rng(seed){ return ()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; }; }
// each chunk takes (b, x, h, r, lv) and returns [newX, newH]; h = top row of the ground (9..12)
const CH={
  // every chunk: (builder, x, ground row h, rng, difficulty 0..1) -> [new x, new ground row]
  flat:(b,x,h,r,d)=>{ const n=5+Math.floor(r()*5); b.ground(x,x+n-1,h); b.v(x+1,h-2,Math.min(4,n-2)); if(n>=7&&r()<.45+d*.35) b.foe(x+n-2,x+1,x+n-1); if(r()<.05) b.ladle(x+Math.floor(n/2),h-4); return [x+n,h]; },
  bump:(b,x,h,r,d)=>{ const t=Math.max(5,h-1-Math.floor(r()*2)); b.ground(x,x+2,h); b.ground(x+3,x+6,t); b.v(x+3,t-2,4); b.ground(x+7,x+9,h); if(r()<.4+d*.3) b.foe(x+8,x+7,x+9); return [x+10,h]; },
  spikes:(b,x,h,r,d)=>{ const n=11+Math.floor(r()*5); b.ground(x,x+n-1,h); let k=x+2; while(k<x+n-3){ const w=1+Math.floor(r()*(1.6+d*1.5)); b.spikes(k,Math.min(k+w-1,x+n-3),h); b.v(k,h-3,w); k+=w+2+Math.floor(r()*3); } return [x+n,h]; },
  gap:(b,x,h,r,d)=>{ const dh=Math.floor(r()*5)-2, nh=Math.max(6,Math.min(12,h+dh)); let w=2+Math.floor(r()*(2+d*1.6)); w=nh<h?Math.min(w,h-nh>1?2:3):Math.min(w,4); b.arc(x,Math.min(h,nh)-2,w+2); return [x+w,nh]; },
  pillars:(b,x,h,r,d)=>{ const n=3+Math.floor(r()*2+d*1.5); let px=x, ph=h; for(let i=0;i<n;i++){ const nh=Math.max(6,Math.min(12,ph+Math.floor(r()*4)-2)); px+=nh<ph?2:2+Math.floor(r()*2); const pw=r()<.75-d*.4?2:1; b.ground(px,px+pw-1,nh); b.v(px,nh-2,pw); px+=pw; ph=nh; } return [px+2,ph]; },
  climb:(b,x,h,r,d)=>{ if(h<9) return CH.drop(b,x,h,r,d); const steps=2+(h>=11?1:0); b.ground(x,x+2,h); let y=h, px=x+3; const under=px;
    for(let i=0;i<steps;i++){ px+=1+Math.floor(r()*2); y-=2; b.plat(px,y,3); b.v(px,y-1,3); px+=3; }
    if(d>.35) b.ground(under,px,h), b.spikes(under+1,px-1,h); else b.ground(under,px,h);
    const nh=Math.max(5,y); b.ground(px+1,px+7,nh); b.v(px+2,nh-2,4); if(r()<.6) b.foe(px+6,px+3,px+7); return [px+8,nh]; },
  drop:(b,x,h,r,d)=>{ if(h>9) return CH.bump(b,x,h,r,d); const nh=Math.min(12,h+3+Math.floor(r()*2)); b.ground(x,x+3,h); b.ground(x+4,x+12,nh); if(d>.25) b.spikes(x+4,x+5,nh); b.v(x+4,h-1,4,1,.6); if(r()<.5+d*.3) b.foe(x+11,x+8,x+12); return [x+13,nh]; },
  crumbleBridge:(b,x,h,r,d)=>{ const w=5+Math.floor(r()*(3+d*3)); b.plat(x,h,w,'c'); b.v(x,h-2,w); return [x+w,h]; },
  movingPit:(b,x,h,r,d)=>{ const w=8+Math.floor(r()*(3+d*3)); b.mov(x+1,h-1,3,'x',w-5,.55+r()*.35+d*.2); b.v(x+2,h-3,w-3); return [x+w,h]; },
  enemyPlat:(b,x,h,r,d)=>{ const n=13; b.ground(x,x+n-1,h); const py=Math.max(4,h-3); b.plat(x+3,py,6); b.v(x+3,py-2,6); b[r()<.5?'inez':'gay'](x+6,x+3,x+8); if(d>.3) b.spikes(x+10,x+11,h); return [x+n,h]; },
  twoRoutes:(b,x,h,r,d)=>{ const n=17; b.ground(x,x+n-1,h); const y1=Math.max(4,h-3), y2=Math.max(3,h-5); b.plat(x+2,y1,4); b.plat(x+7,y2,5); b.v(x+7,y2-2,5); b.ladle(x+11,y2-2);
    b.spikes(x+6,x+8,h); b.vac(x+13,x+12,x+16); return [x+n,h]; },
  plats:(b,x,h,r,d)=>{ const w=8+Math.floor(r()*3); for(let k=0;k<3;k++){ const px=x+1+k*Math.floor(w/3), y=Math.max(4,h-2-k); b.plat(px,y,k===1&&d>.5?2:3); b.v(px,y-1,2); } return [x+w,Math.max(8,h-1)]; },
  bigGap:(b,x,h,r,d)=>{ const w=8+Math.floor(r()*(3+d*2)); b.v(x,h-3,w,1,.12); return [x+w,Math.min(12,h+1)]; },
  ventGap:(b,x,h,r,d)=>{ const w=12+Math.floor(r()*5); b.vent(x+Math.floor(w*.33)); b.vent(x+Math.floor(w*.7)); b.v(x+2,h-5,w-4); return [x+w,Math.max(8,h-1)]; },
