<style>
:root{--vw:1vw;--vh:1vh;--red:#c0392b;--ink:#2b1d14;--cream:#fff8ea;--green:#2f6b45}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d1426;color:var(--ink);font-family:'Baloo 2',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}

#bL{left:3%}#bR{left:14%}#bT{right:15%}#bS{right:25.5%;bottom:14%!important}#bJ{right:3%;width:11cqw!important;height:11cqw!important}

<body>
<div id="rot">
<div id="stage">
  <canvas id="cv" width="1280" height="720" aria-label="Gra: Kaczor ucieka do sauny"></canvas>
  <div id="touch" class="hidden"><button id="bL" aria-label="W lewo">◀</button><button id="bR" aria-label="W prawo">▶</button><button id="bT" aria-label="Uderzenie">👊</button><button id="bS" aria-label="Rzuć śnieżką">❄</button><button id="bJ" aria-label="Skok">⤒</button></div>

  <div id="end" class="ov hidden"><div class="card"><h2>Sauna! 🧖‍♂️🏳️‍🌈</h2><p id="eTxt"></p><div class="tBtns"><button class="btn" id="eAgain">Zagraj od nowa</button></div></div></div>

<script>
// ---------- phone held upright: turn the whole game sideways (same trick as the main game) ----------
(function(){ const root=document.documentElement, coarse=matchMedia('(pointer:coarse)');
  function orient(){ const w=innerWidth,h=innerHeight,on=coarse.matches&&h>w; document.body.classList.toggle('turned',on);
    root.style.setProperty('--vw',(on?h:w)/100+'px'); root.style.setProperty('--vh',(on?w:h)/100+'px'); root.style.setProperty('--tx',w+'px'); }
  addEventListener('resize',orient); addEventListener('orientationchange',()=>setTimeout(orient,250)); orient();
  if(coarse.matches) document.getElementById('touch').classList.remove('hidden'); })();

const $=s=>document.querySelector(s);
const cv=$('#cv'), c=cv.getContext('2d'), VW=1280, VH=720, T=48, ROWS=15;
const img=n=>{ const i=new Image(); i.src='art/'+n+'.webp'; return i; };
const IMG={}; ['kz_idle','kz_run1','kz_run2','kz_run3','kz_run4','kz_jump','kz_fall','kz_punch','kz_wind','kz_throw','kz_glide','kz_towel','kz_twalk1','kz_twalk2','kz_tjoy','kaka_run1','kaka_run2','kaka_point','inez_walk1','inez_walk2','inez_kiss','it_vihta','it_ladle','it_snow','it_chore','it_kiss','it_phone','sauna','bg1','bg2','bg3','bg_birch','bg_market','bg_ski','bg_cave','bg_pier','bg_springs','bg_village','inez_hit','inez_dizzy','inez_huff','mar_idle'].forEach(n=>IMG[n]=img(n));

// ---------- smooth animations (Ludo.ai spritesheets, packed into strips with a body anchor) ----------
const ANIM={}; fetch('art/anim/anim.json').then(r=>r.json()).then(j=>{ for(const k in j){ ANIM[k]=j[k]; ANIM[k].img=img('anim/'+k); } }).catch(()=>{});
function drawAnim(name,x,y,t,flip,prog){ const a=ANIM[name]; if(!a||!a.img.complete||!a.img.naturalWidth) return false;
  const f=prog!=null?Math.max(0,Math.min(a.n-1,Math.floor(prog*a.n))):a.loop?Math.floor(t*a.fps)%a.n:Math.min(a.n-1,Math.floor(t*a.fps));
  const sc=.5; c.save(); c.translate(x,y); if(flip) c.scale(-1,1); c.drawImage(a.img,f*a.w,0,a.w,a.h,-a.ax*sc,-a.h*sc,a.w*sc,a.h*sc); c.restore(); return true; }
// ---------- audio ----------
let muted=false, cur=null; const bgm=new Audio('audio/music.mp3'); bgm.loop=true; bgm.volume=.28;
function play(key){ if(muted) return; if(cur) cur.pause(); const a=new Audio('audio/'+key+'.mp3'); cur=a; bgm.volume=.1; a.onended=()=>{ bgm.volume=.28; }; a.play().catch(()=>{}); }
let AC=null; function sfx(type){ if(muted) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain(); o.connect(g).connect(AC.destination);
  const S={jump:[['triangle',420,720,.12,.12]],pick:[['sine',880,1320,.09,.12]],hit:[['sawtooth',300,110,.25,.14]],throw:[['square',600,300,.08,.06]],pop:[['triangle',700,200,.18,.12]],life:[['sine',660,1320,.3,.14]]}[type][0];
  o.type=S[0]; o.frequency.setValueAtTime(S[1],t); o.frequency.exponentialRampToValueAtTime(S[2],t+S[3]); g.gain.setValueAtTime(S[4],t); g.gain.exponentialRampToValueAtTime(.001,t+S[3]+.05); o.start(t); o.stop(t+S[3]+.06); }catch(e){} }
$('#mute').onclick=e=>{ e.stopPropagation(); muted=!muted; $('#mute').textContent=muted?'🔇':'🔊'; if(muted){ bgm.pause(); if(cur) cur.pause(); } else bgm.play().catch(()=>{}); };

// ---------- levels: 10 worlds, each generated from hand-designed chunks (seeded, so every run is the same) ----------
// tiles: # ground   = one-way platform   c crumbling platform   w water (lake hole)
// entities: vihta, ladle, inez, spring, icicle; plus moving platforms, steam vents, wind zones, checkpoints, goal
function build(W){ const g=Array.from({length:ROWS},()=>Array(W).fill(' ')), L={W,g,ent:[],vents:[],cps:[],movs:[],winds:[],goal:0};
  const api={ L, ground:(a,b,top)=>{ for(let x=a;x<=b;x++) for(let y=top;y<ROWS;y++) g[y][x]='#'; },
    plat:(x,y,n,ch='=')=>{ for(let i=0;i<n;i++) if(x+i<W) g[y][x+i]=ch; },
    water:(a,b)=>{ for(let x=a;x<=b;x++) g[12][x]='w'; },
    v:(x,y,n=1,dx=1,dy=0)=>{ for(let i=0;i<n;i++) L.ent.push({k:'vihta',x:(x+i*dx)*T+T/2,y:(y+i*dy)*T+T/2}); },
    arc:(x,y,n,hh=2.2)=>{ for(let i=0;i<n;i++){ const t=i/(n-1||1); L.ent.push({k:'vihta',x:(x+i)*T+T/2,y:(y-Math.sin(t*Math.PI)*hh)*T+T/2}); } },
    ladle:(x,y)=>L.ent.push({k:'ladle',x:x*T+T/2,y:y*T+T/2}),
    inez:(x,a,b)=>L.ent.push({k:'inez',x:x*T,a:a*T,b:b*T}),
    gay:(x,a,b)=>L.ent.push({k:'gay',x:x*T,a:a*T,b:b*T}),
    spring:(x,top)=>L.ent.push({k:'spring',x:x*T+T/2,y:top*T}),
    icicle:(x)=>L.ent.push({k:'icicle',x:x*T+T/2,y:0}),
    mov:(x,y,w,ax,range,sp)=>L.movs.push({x0:x*T,y0:y*T,w:w*T,ax,range:range*T,sp,ph:0,x:x*T,y:y*T,dx:0,dy:0}),
    vent:x=>L.vents.push(x*T+T/2),
    wind:(a,b,f)=>L.winds.push([a*T,b*T,f]),
    cp:x=>L.cps.push(x*T) };
  return api; }
function rng(seed){ return ()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; }; }
// each chunk takes (b, x, h, r, lv) and returns [newX, newH]; h = top row of the ground (9..12)
const CH={
  flat:(b,x,h,r,lv)=>{ const n=10+Math.floor(r()*8); b.ground(x,x+n-1,h); b.v(x+2,h-2,Math.min(6,n-4));
    if(n>=12&&r()<.55+lv*.04) b[r()<.3+lv*.04?'gay':'inez'](x+n-4,x+2,x+n-2); if(r()<.06) b.ladle(x+Math.floor(n/2),h-4); return [x+n,h]; },
  inezRow:(b,x,h,r,lv)=>{ const n=16; b.ground(x,x+n-1,h); b.inez(x+5,x+2,x+7); b.gay(x+13,x+10,x+15); b.arc(x+2,h-3,6); return [x+n,h]; },
  gap:(b,x,h,r)=>{ const w=2+Math.floor(r()*3); b.arc(x,h-2,w+2); const nh=w>=3?Math.min(12,h+Math.floor(r()*2)):Math.max(9,Math.min(12,h+Math.floor(r()*4)-2)); return [x+w,nh]; },
  step:(b,x,h,r)=>{ const up=r()<.5&&h>9; const nh=up?h-1-Math.floor(r()*Math.min(2,h-9)):Math.min(12,h+1+Math.floor(r()*2)); b.ground(x,x+5,nh); b.v(x+1,nh-2,4); return [x+6,nh]; },
  plats:(b,x,h,r)=>{ const w=7+Math.floor(r()*3); let y=h-2; for(let k=0;k<3;k++){ const px=x+1+k*Math.floor(w/3); y=Math.max(4,h-2-k); b.plat(px,y,3); b.v(px,y-1,3); } return [x+w,Math.max(9,h-1)]; },
  bigGap:(b,x,h,r)=>{ const w=8+Math.floor(r()*4); b.v(x,h-3,w,1,.12); return [x+w,Math.min(12,h+1)]; },
  ventGap:(b,x,h,r)=>{ const w=12+Math.floor(r()*5); b.vent(x+Math.floor(w*.33)); b.vent(x+Math.floor(w*.7)); b.v(x+2,h-5,w-4); return [x+w,Math.max(9,h-1)]; },
  water:(b,x,h,r)=>{ b.ground(x,x+2,12); const w=3+Math.floor(r()*5); b.water(x+3,x+2+w); for(let k=x+4;k<x+2+w;k+=3) b.plat(k,11,2); b.arc(x+2,9,w+2,1.6); b.ground(x+3+w,x+5+w,12); return [x+6+w,12]; },
  moving:(b,x,h,r)=>{ const w=8+Math.floor(r()*3); b.mov(x+1,h-1,3,'x',w-5,.6+r()*.4); b.v(x+2,h-3,w-3); return [x+w,h]; },
  elevator:(b,x,h,r)=>{ const top=Math.max(5,h-5); b.ground(x,x+4,h); b.mov(x+3,h-1,2,'y',-(h-top),1.1); b.ground(x+5,x+11,top); b.v(x+6,top-2,5); b.inez(x+9,x+6,x+11); return [x+12,top]; },
  down:(b,x,h,r)=>{ const nh=12; b.ground(x,x+5,nh); b.v(x+1,nh-2,4); return [x+6,nh]; },
  crumble:(b,x,h,r)=>{ const w=5+Math.floor(r()*4); b.plat(x,h,w,'c'); b.v(x,h-2,w); return [x+w,h]; },
  spring:(b,x,h,r)=>{ const top=Math.max(5,h-5); b.ground(x,x+3,h); b.spring(x+3,h); b.ground(x+4,x+11,top); b.v(x+3,h-4,1); b.v(x+3,top-3,3,1,-.5); b.v(x+6,top-2,5); return [x+12,top]; },
  icicles:(b,x,h,r)=>{ const n=14; b.ground(x,x+n-1,h); for(let k=x+3;k<x+n-1;k+=3) b.icicle(k); b.v(x+1,h-2,n-2); return [x+n,h]; },
  wind:(b,x,h,r)=>{ const w=13+Math.floor(r()*4); b.wind(x-2,x+w,260); b.v(x+1,h-4,w-2,1,0); return [x+w,Math.min(12,h+1)]; },
};
function genLevel(D,i){ const r=rng(1234+i*7919), W=D.len, b=build(W), L=b.L; let x=0,h=12;
  b.ground(0,13,12); b.v(5,10,5); x=14;
  const pool=[]; Object.entries(D.mix).forEach(([k,n])=>{ for(let q=0;q<n;q++) pool.push(k); });
  let sinceCp=0, sinceLadle=0, prev='';
  while(x<W-46){ let k=pool[Math.floor(r()*pool.length)]; if(k===prev&&k!=='flat') k='flat'; prev=k;
    const x0=x; [x,h]=CH[k](b,x,h,r,i); if(k!=='gap'&&k!=='bigGap'&&k!=='ventGap'&&k!=='wind'&&k!=='plats'&&k!=='moving'&&k!=='crumble') {} 
    // after any gap-like chunk always land on solid ground
    if(['gap','bigGap','ventGap','wind','plats','moving','crumble'].includes(k)){ const n=6+Math.floor(r()*4); b.ground(x,x+n-1,h); b.v(x+1,h-2,3); x+=n; }
    sinceCp+=x-x0; sinceLadle+=x-x0;
    if(sinceCp>85){ b.ground(x,x+6,h); b.cp(x+2); x+=7; sinceCp=0; }
    if(sinceLadle>180){ b.ladle(x-3,h-3); sinceLadle=0; } }
  b.ground(x,W-1,12); b.v(x+2,10,8); L.goal=(W-20)*T; L.W=W;
  // the same kind of enemy is never on screen twice: drop any Inez / Gayzilla whose patrol comes within a screen and a half of the previous one
  ['inez','gay'].forEach(k=>{ let lastB=-1e9; L.ent=L.ent.filter(e=>{ if(e.k!==k) return true; if(e.a-lastB<VW*1.5){ return false; } lastB=e.b; return true; }); });
  // Maryańska, Kaczor's hippie mentor, waits by the middle checkpoint (in the last level: right before the sauna)
  L.mar=i===9?(W-32)*T:(L.cps.length?L.cps[Math.floor(L.cps.length/2)]-T*2:W*T/2); L.marDone=false; L.marT=0;
  return L; }
const MAR_TXT=['Kaczorku, kochanie! Kaka ma listę zadań, a ty masz jedno życie. Biegnij, wolny ptaku!','Las szumi: rób, co kochasz! Odkurzanie poczeka, sauna nie.','Lód jest śliski jak wymówki Kaki. Stąpaj lekko i nie daj się zniewolić!','Na jarmarku kup sobie grzańca, nie mopa! Twoje życie, twoje zasady.','Pamiętaj, słoneczko: nikt nie ma prawa trzymać cię na smyczy z listą obowiązków.','W ciemności słuchaj serca, nie Kaki. A serce mówi: sauna!','Morsowanie hartuje ducha! Zimna woda, gorąca dusza. Peace!','Leć, Kaczorze! Wolność smakuje najlepiej z wysokości!','Gorące źródła, gorące serce. Już prawie! Nie oglądaj się za siebie.','To tu, kochany! Ręcznik na biodra i do sauny. Jestem z ciebie dumna!'];
const LEVELS=[
 {name:'Osiedle',bg:'bg1',style:'earth',snow:'#fdfdff',kaka:200,line:'kz_start',len:860,
  txt:'Kaka ma dla mnie listę zadań. Długą. Czas uciekać… do sauny!',mix:{flat:5,gap:4,step:3,plats:3,bigGap:1,inezRow:1}},
 {name:'Las brzozowy',bg:'bg_birch',style:'forest',snow:'#fdfdff',kaka:205,line:'kz_birch',len:880,
  txt:'Las brzozowy! Każda brzoza to potencjalna witka do sauny. Uwaga na spróchniałe gałęzie i sprężyste pnie!',mix:{flat:4,gap:3,step:3,plats:2,crumble:3,spring:2,inezRow:1}},
 {name:'Zamarznięte jezioro',bg:'bg2',style:'ice',snow:'#ffffff',kaka:210,line:'kz_lake',len:900,slip:true,
  txt:'Przerębel! Morsowanie? Zawsze. Ale nie teraz. Lód jest śliski, a kry się kołyszą!',mix:{flat:4,water:5,gap:2,plats:2,crumble:1,inezRow:1}},
 {name:'Jarmark świąteczny',bg:'bg_market',style:'cobble',snow:'#ffffff',kaka:212,line:'kz_market',len:900,
  txt:'Grzaniec, oscypki… Nie! Skup się, Kaczor. Skacz po dachach straganów i jeżdżących saniach!',mix:{flat:4,gap:2,step:2,plats:4,moving:3,spring:2,inezRow:2}},
 {name:'Stok narciarski',bg:'bg_ski',style:'snowpack',snow:'#ffffff',kaka:215,line:'kz_ski',len:920,slip:true,

    c.fillStyle='#d23a2f'; c.beginPath(); c.roundRect(X,Y,m.w,30,8); c.fill(); c.fillStyle='#bfe6ff'; for(let k=8;k<m.w-14;k+=24) c.fillRect(X+k,Y+6,16,10); }
  else if(st==='cobble'){ c.fillStyle='#b5332a'; c.beginPath(); c.moveTo(X,Y); c.lineTo(X+m.w,Y); c.quadraticCurveTo(X+m.w+18,Y+10,X+m.w,Y+24); c.lineTo(X+8,Y+24); c.quadraticCurveTo(X-6,Y+12,X,Y); c.fill();
    c.strokeStyle='#e9b949'; c.lineWidth=3; c.beginPath(); c.moveTo(X+4,Y+30); c.lineTo(X+m.w,Y+30); c.stroke(); c.fillStyle='#fff'; c.fillRect(X+6,Y+3,m.w-12,4); }
  else { c.fillStyle='#7a4e2e'; c.beginPath(); c.roundRect(X,Y+2,m.w,18,6); c.fill(); c.strokeStyle='rgba(50,30,15,.6)'; c.lineWidth=1.5; c.beginPath(); c.moveTo(X+6,Y+11); c.lineTo(X+m.w-6,Y+11); c.stroke();
    c.strokeStyle='#666'; c.lineWidth=2; if(m.ax==='y'){ c.beginPath(); c.moveTo(X+8,Y); c.lineTo(X+8,0); c.moveTo(X+m.w-8,Y); c.lineTo(X+m.w-8,0); c.stroke(); } }
  c.fillStyle=L.D.snow; c.beginPath(); c.roundRect(X-2,Y-5,m.w+4,9,4); c.fill(); }); }
function drawWinds(){ L.winds.forEach(([a,b,f])=>{ if(b-cam<0||a-cam>VW) return; c.strokeStyle='rgba(255,255,255,.45)'; c.lineWidth=2;
  for(let i=0;i<14;i++){ const y=80+((i*97)%520), x=a+((t0*f*1.6+i*173)%(b-a)); c.beginPath(); c.moveTo(x-cam,y); c.quadraticCurveTo(x-cam+30,y-6,x-cam+70,y); c.stroke(); } }); }
function drawVents(){ L.vents.forEach(vx=>{ const X=vx-cam; if(X<-80||X>VW+80) return; const g=c.createLinearGradient(0,VH,0,VH-T*11); g.addColorStop(0,'rgba(255,220,180,.45)'); g.addColorStop(1,'rgba(255,255,255,0)'); c.fillStyle=g; c.fillRect(X-T*1.3,VH-T*11,T*2.6,T*11);
  for(let i=0;i<7;i++){ const p=(t0*.6+i/7)%1; c.fillStyle=`rgba(255,255,255,${.5*(1-p)})`; c.beginPath(); c.arc(X+Math.sin(p*9+i)*18,VH-p*T*11,14+p*20,0,Math.PI*2); c.fill(); } }); }
function draw(){ c.clearRect(0,0,VW,VH); drawBg(); drawWinds(); drawVents(); drawTiles(); drawMovs();
  // checkpoints (birch post with a towel) and the sauna
  L.cps.forEach(x=>{ const X=x-cam, gy=groundY(x+4)||VH; if(X<-60||X>VW+60) return; c.fillStyle='#f3efe6'; c.fillRect(X-4,gy-90,8,90); c.fillStyle='#333'; for(let i=0;i<5;i++) c.fillRect(X-4,gy-80+i*16,8,3); c.fillStyle=cp>=x?'#ff6f61':'#ddd'; c.beginPath(); c.roundRect(X+4,gy-88,34,24,4); c.fill(); });
  const sx=L.goal-cam; if(sx>-500&&sx<VW+200){ drawImg(IMG.sauna,sx+140,(groundY(L.goal+140)||VH)+8,300,false); if(Math.random()<.15) parts.push({x:L.goal+140+(Math.random()-.5)*60,y:(groundY(L.goal+140)||VH)-260,vx:(Math.random()-.5)*30,vy:-60,t:.7,col:'rgba(255,255,255,.6)',r:10}); }
  ents.forEach(e=>{ if(!e.alive) return; const X=e.x-cam; if(X<-120||X>VW+120) return;
    if(e.k==='vihta') drawImg(IMG.it_vihta,X,e.y+18+Math.sin(t0*3+e.x)*4,36);
    else if(e.k==='ladle') drawImg(IMG.it_ladle,X,e.y+22+Math.sin(t0*3)*4,46);
    else if((e.k==='inez'||e.k==='gay')&&e.state){ const pre=e.k==='gay'?'gay_':'inez_';
      const ok=e.state==='hit'?drawAnim(pre+'hit',X,e.y+2,0,e.kx<0,1-e.st/.4):e.state==='dizzy'?drawAnim(pre+'dizzy',X,e.y+4,t0,e.dir>0):(c.globalAlpha=Math.max(0,Math.min(1,e.st)),drawAnim(pre+'huff',X,e.y+2,t0,e.hdir>0));
      c.globalAlpha=1; if(ok||e.k==='gay') return;
      if(e.state==='hit') drawImg(IMG.inez_hit,X,e.y+2,144,e.kx<0);
      else if(e.state==='dizzy'){ drawImg(IMG.inez_dizzy,X,e.y+4,104,e.dir>0); for(let q=0;q<4;q++){ const a=t0*5+q*Math.PI/2; c.fillStyle='#ffd34e'; star(X+Math.cos(a)*34,e.y-96+Math.sin(a)*9,7); } }
      else { c.globalAlpha=Math.max(0,Math.min(1,e.st)); drawImg(IMG.inez_huff,X,e.y+2,144,e.hdir>0); c.globalAlpha=1; } }
    else if(e.k==='gay'){ const fl=e.dir>0; if(e.mode==='throw') drawAnim('gay_throw',X,e.y+2,0,fl,1-e.mt/.55); else if(e.mode==='selfie') drawAnim('gay_selfie',X,e.y+2,e.t,fl); else drawAnim('gay_walk',X,e.y+2,e.t,fl); }
    else if(e.k==='inez'){ const fl=e.dir>0; if(!(e.kissT>0?drawAnim('inez_kiss',X,e.y+2,0,fl,1-e.kissT/.5):drawAnim('inez_walk',X,e.y+2,e.t,fl))){ const im=e.kissT>0?IMG.inez_kiss:(Math.floor(e.t*5)%2?IMG.inez_walk1:IMG.inez_walk2); drawImg(im,X,e.y+2,128,fl); } }
    else if(e.k==='spring') drawSpring(X,e.y,e.sq||0);
    else if(e.k==='icicle') drawIcicle(X,e.y,e.st==='shake'?Math.sin(t0*60)*3:0); });
  kisses.forEach(k=>drawImg(IMG.it_kiss,k.x-cam,k.y+14,30));
  snowballs.forEach(b=>drawImg(IMG.it_snow,b.x-cam,b.y+12,24));
  phones.forEach(f=>{ c.save(); c.translate(f.x-cam,f.y); c.rotate(f.rot); drawImg(IMG.it_phone,0,18,36); c.restore(); });
  flyers.forEach(f=>{ c.save(); c.translate(f.x-cam,f.y-70); c.rotate(f.rot); c.globalAlpha=Math.min(1,f.t); drawImg(IMG.inez_kiss,0,70,144,f.dir>0); c.restore(); });
  // Maryańska
  if(L.mar){ const mx=L.mar-cam; if(mx>-150&&mx<VW+150){ const my=(groundY(L.mar)||VH)+2, fl=P.x<L.mar;
    if(!drawAnim(L.marT>0?'mar_talk':'mar_cheer',mx,my,t0,fl)) drawImg(IMG.mar_idle,mx,my,128,fl);
    if(L.marT>0) bubble(mx,my-150,MAR_TXT[lvl]); } }
  // Kaka
  const kx=kaka.x-cam; if(kx>-200){ if(kaka.wait>0||!drawAnim('kaka_run',kx,kaka.y+2,kaka.anim,false)) drawImg(kaka.wait>0?IMG.kaka_point:(Math.floor(kaka.anim*7)%2?IMG.kaka_run1:IMG.kaka_run2),kx,kaka.y+2,128,false); }
  // Kaczor
  if(!(P.inv>0&&Math.floor(P.inv*12)%2)){ const X=P.x-cam, Y=P.y+P.h+2;
    const fl=P.face<0;
    const an=P.glide?drawAnim('kz_glide',X,Y+20,t0,fl):P.towel?drawAnim(P.joy>0?'kzt_joy':'kzt_walk',X,Y,Math.abs(P.vx)>20||P.joy>0?t0:0,fl)
      :P.snowA>0?drawAnim('kz_throw',X,Y,0,fl,1-P.snowA/.36):P.punchT>0?drawAnim('kz_punch',X,Y,0,fl,1-P.punchT/.28)
      :!P.on?drawAnim(P.vy<0?'kz_air':'kz_fall',X,Y,t0,fl):Math.abs(P.vx)>30?drawAnim('kz_run',X,Y,P.runT,fl):drawAnim('kz_idle',X,Y,t0,fl);
    if(an){}
    else if(P.glide) drawImg(IMG.kz_glide,X,Y+22,240,P.face<0);
    else if(P.towel){ const im=P.joy>0?IMG.kz_tjoy:Math.abs(P.vx)>20?(Math.floor(P.anim*6)%2?IMG.kz_twalk1:IMG.kz_twalk2):IMG.kz_towel; drawImg(im,X,Y,128,P.face<0); }
    else { const RUN=[IMG.kz_run1,IMG.kz_run2,IMG.kz_run3,IMG.kz_run4];
      const im=P.snowA>.22?IMG.kz_wind:P.snowA>0?IMG.kz_throw:P.punchT>0?IMG.kz_punch:!P.on?(P.vy<0?IMG.kz_jump:IMG.kz_fall):Math.abs(P.vx)>30?RUN[Math.floor(P.anim*11)%4]:IMG.kz_idle; drawImg(im,X,Y,128,P.face<0); } }
  parts.forEach(p=>{ c.globalAlpha=Math.max(0,p.t/.7); c.fillStyle=p.col; c.beginPath(); c.arc(p.x-cam,p.y,p.r,0,Math.PI*2); c.fill(); }); c.globalAlpha=1;
  // falling snow
  c.fillStyle='rgba(255,255,255,.8)'; for(let i=0;i<60;i++){ const x=((i*197+t0*(20+i%5*8))%VW+VW)%VW, y=((i*131+t0*(40+i%7*9))%VH); c.beginPath(); c.arc(x,y,1.2+i%3,0,Math.PI*2); c.fill(); }
  if(L.D.dark){ const X=P.x-cam, Y=P.y+40, g=c.createRadialGradient(X,Y,140,X,Y,520); g.addColorStop(0,'rgba(2,8,24,0)'); g.addColorStop(1,'rgba(2,8,24,.86)'); c.fillStyle=g; c.fillRect(0,0,VW,VH); }
  // HUD
  c.font='700 30px "Baloo 2",sans-serif'; c.textBaseline='middle';
  for(let i=0;i<Math.max(3,hearts);i++){ c.globalAlpha=i<hearts?1:.25; c.fillText('❤️',24+i*38,40); } c.globalAlpha=1;
  drawImg(IMG.it_vihta,40,108,40); c.fillStyle='#fff'; c.strokeStyle='rgba(0,0,0,.6)'; c.lineWidth=5; c.strokeText('× '+vihta,64,92); c.fillText('× '+vihta,64,92);
  c.textAlign='center'; c.font='700 26px "Baloo 2",sans-serif'; const nm=`Poziom ${lvl+1}: ${L.D.name}`; c.strokeText(nm,VW/2,34); c.fillText(nm,VW/2,34);
  // Kaka meter
  const gap=Math.max(0,Math.min(1,(P.x-kaka.x)/900)); c.fillStyle='rgba(0,0,0,.35)'; c.beginPath(); c.roundRect(VW/2-160,58,320,16,8); c.fill();
  c.fillStyle=gap<.3?'#ff5a4e':gap<.6?'#ffc94e':'#7ed957'; c.beginPath(); c.roundRect(VW/2-160,58,320*gap,16,8); c.fill();
  c.font='600 17px "Baloo 2",sans-serif'; c.fillStyle='#fff'; const kt=gap<.3?'Kaka tuż za tobą!':'Kaka z listą zadań'; c.strokeText(kt,VW/2,90); c.fillText(kt,VW/2,90);
  toasts.forEach((t,i)=>{ c.globalAlpha=Math.min(1,t.t*2); c.font='700 30px "Baloo 2",sans-serif'; c.fillStyle=t.col; c.lineWidth=6; c.strokeText(t.txt,VW/2,170+i*42); c.fillText(t.txt,VW/2,170+i*42); }); c.globalAlpha=1; c.textAlign='left';
  if(lvl===0&&t0<9&&state==='play'){ c.textAlign='center'; c.font='600 22px "Baloo 2",sans-serif'; c.fillStyle='#fff'; c.lineWidth=5; const h='Przytrzymaj skok w powietrzu, żeby rozwinąć paralotnię 🪂'; c.strokeText(h,VW/2,VH-40); c.fillText(h,VW/2,VH-40); c.textAlign='left'; }
}

// ---------- flow ----------
// between-level story cards, narrated by Jugo (audio/jugo_1..10, jugo_end)
const JUGO=['Był sobie Kaczor. Kochał saunę, morsowanie i paralotnie. A Kaka kochała listy zadań. Pewnego ranka Kaczor zobaczył listę… i zaczął biec.','Osiedle zostało w tyle, ale Kaka nie odpuszcza. Kaczor wbiegł do brzozowego lasu, bo gdzie brzozy, tam witki, a gdzie witki, tam sauna.','Po lesie przyszła kolej na zamarznięte jezioro. Kaczor kocha przeręble, ale tym razem nie było czasu na kąpiel. Lista Kaki rosła z każdą minutą.','Jarmark świąteczny pachniał grzańcem. Kaka krzyczała coś o choince do ubrania. Kaczor udał, że nie słyszy, i wskoczył na dach straganu.','Stok narciarski. Gondole, wyciągi i Gayzilla z telefonem. Kaczor wiedział jedno: żadnych selfie, dopóki nie dotrze do sauny.','Lodowa jaskinia była ciemna i zimna. Kaczor myślał, że tu Kaka go nie znajdzie. Mylił się. Kaka znajdzie każdego.','Bałtyk zimą! Morsy machały do Kaczora z wody. On też chciał wskoczyć, ale za plecami słyszał już: „Kaczor, a odkurzanie?”','W Tatrach wiało jak trzeba. Kaczor rozłożył paralotnię i poczuł, że jest wolny. Przynajmniej do następnego punktu kontrolnego.','Gorące źródła. Para, ciepło, prawie jak sauna. Ale „prawie” robi wielką różnicę, a Kaka była coraz bliżej.','I wreszcie: wioska saun pod zorzą polarną. Inez wszędzie, Kaka tuż za nim. Ostatnia prosta, Kaczorze. Biegnij!'];
const JUGO_END='I tak Kaczor dotarł do swojej sauny. Kaka? Została z listą zadań. A Kaczor? Kaczor wreszcie odpoczął. Koniec.';
function showIntro(i){ state='intro'; loadLevel(i,i>0); const D=LEVELS[i]; $('#iFace').style.backgroundImage='url(art/jugo_face.webp)'; $('#iName').textContent=`Poziom ${i+1}: ${D.name}`; $('#iNarr').textContent=JUGO[i]; $('#iTxt').textContent=`Kaczor: „${D.txt}”`; $('#intro').classList.remove('hidden'); play('jugo_'+(i+1)); }
$('#iGo').onclick=()=>{ $('#intro').classList.add('hidden'); state='play'; t0=0; play(LEVELS[lvl].line); };
function finishLevel(){ if(state!=='play') return; state='outro'; sfx('life'); P.towel=true; P.vx=0; P.inv=0; puff(P.x,P.y+40,'#ffffff',22); toast('Ręcznik na biodra — czas na saunę! 🧖','#d6ffd9'); }
function outro(dt){ t0+=dt; P.anim+=dt; const door=L.goal+140; toasts.forEach(t=>t.t-=dt); toasts=toasts.filter(t=>t.t>0); parts.forEach(p=>{ p.t-=dt; p.vy+=500*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }); parts=parts.filter(p=>p.t>0);
  if(P.joy<=0&&Math.abs(P.x-door)>6){ P.face=Math.sign(door-P.x); P.vx=P.face*140; P.x+=P.vx*dt; if(Math.abs(P.x-door)<=6) P.x=door; }
  else if(P.joy<=0){ P.vx=0; P.joy=1.8; if(Math.random()<1) for(let i=0;i<4;i++) puff(door+(Math.random()-.5)*80,P.y+20,'rgba(255,255,255,.8)',4); }
  else { P.joy-=dt; if(Math.random()<.3) puff(door+(Math.random()-.5)*90,P.y+30,'rgba(255,255,255,.7)',2); if(P.joy<=0){ P.joy=-1; state='done'; nextAfterSauna(); } }
  cam+=((P.x-VW*.5)-cam)*Math.min(1,dt*3); cam=Math.max(0,Math.min(L.W*T-VW,cam)); }
function nextAfterSauna(){
  if(lvl+1>best){ best=lvl+1; try{ localStorage.setItem('kz-level',best); }catch(e){} }
  if(lvl<LEVELS.length-1) showIntro(lvl+1);
  else { $('#end').classList.remove('hidden'); $('#eTxt').textContent=`Dotarłeś do gejowskiej sauny! Zebrane witki: ${vihta}. Para, chłopaki i święty spokój — tu żadna lista zadań cię nie znajdzie. ${JUGO_END}`; play('kz_win'); setTimeout(()=>{ if(!$('#end').classList.contains('hidden')) play('kaka_end'); },6500); setTimeout(()=>{ if(!$('#end').classList.contains('hidden')) play('jugo_end'); },12500); } }
$('#oGo').onclick=()=>{ $('#over').classList.add('hidden'); const keepV=vihta; loadLevel(lvl,false); vihta=keepV; state='play'; t0=0; };
$('#eAgain').onclick=()=>{ $('#end').classList.add('hidden'); vihta=0; showIntro(0); };
function start(i){ $('#title').classList.add('hidden'); if(!muted) bgm.play().catch(()=>{}); vihta=0; showIntro(i);
  if(matchMedia('(pointer:coarse)').matches){ const d=document.documentElement,rq=d.requestFullscreen||d.webkitRequestFullscreen; try{ const p=rq&&rq.call(d); p&&p.then&&p.then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})).catch(()=>{}); }catch(e){} } }
const qs=new URLSearchParams(location.search), qlv=+qs.get('level');
if(best>0&&best<LEVELS.length){ $('#play').textContent=`Graj dalej — poziom ${best+1} ▶`; $('#fresh').classList.remove('hidden'); }
$('#play').onclick=()=>start(qlv?Math.min(qlv,LEVELS.length)-1:(best<LEVELS.length?best:0));
$('#fresh').onclick=()=>start(0);
LEVELS.forEach((D,i)=>{ const bt=document.createElement('button'); bt.textContent=`${i+1}. ${D.name}`; bt.disabled=i>Math.min(best,LEVELS.length-1); bt.onclick=()=>start(i); $('#lvls').append(bt); });
loadLevel(0); // draws behind the title
let last=performance.now();
const WARP=+(qs.get('warp')||1);
function loop(now){ const dt=Math.min(.033,(now-last)/1000); last=now; if(state==='play'){ for(let w=0;w<WARP&&state==='play';w++) update(dt); } else if(state==='outro') outro(dt); else t0+=dt; if(L) draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
window.__L=(x,y)=>L?tile(x,y):' '; window.__gen=i=>genLevel(LEVELS[i],i); window.__kz={get L(){return L}, get hearts(){return hearts}, set hearts(v){hearts=v}, get P(){return P}, get kaka(){return kaka}, get state(){return state}, get lvl(){return lvl}, K, finishLevel:()=>finishLevel()};
</script>
